<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="edgeGrad_20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="centerGrad_20" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
    <filter id="chipDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#chipDropShadow)">
    <!-- Main Outer Body -->
    <circle cx="50" cy="50" r="46" fill="url(#edgeGrad_20)" stroke="#38bdf8" stroke-width="1"/>

    <!-- 12 Classic Casino Edge Stripes -->
    <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="butt">
      <line x1="50" y1="4" x2="50" y2="96" stroke-dasharray="8 80"/>
      <line x1="50" y1="4" x2="50" y2="96" stroke-dasharray="8 80" transform="rotate(30 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="96" stroke-dasharray="8 80" transform="rotate(60 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="96" stroke-dasharray="8 80" transform="rotate(90 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="96" stroke-dasharray="8 80" transform="rotate(120 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="96" stroke-dasharray="8 80" transform="rotate(150 50 50)"/>
    </g>

    <!-- Inner Groove Ring -->
    <circle cx="50" cy="50" r="37.5" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="37" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.8"/>

    <!-- Gold Stitched Thread Ring -->
    <circle cx="50" cy="50" r="32.5" fill="none" stroke="#eab308" stroke-width="1.4" stroke-dasharray="2.5 1.5"/>

    <!-- Center Inlay Disc -->
    <circle cx="50" cy="50" r="28" fill="url(#centerGrad_20)" stroke="#ca8a04" stroke-width="1.2"/>

    <!-- Micro Detail Ring -->
    <circle cx="50" cy="50" r="23" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="1 2" opacity="0.6"/>

    <!-- Stars -->
    <text x="30" y="52" font-family="Arial, sans-serif" font-size="7" fill="#0369a1" text-anchor="middle" opacity="0.65">&#9733;</text>
    <text x="70" y="52" font-family="Arial, sans-serif" font-size="7" fill="#0369a1" text-anchor="middle" opacity="0.65">&#9733;</text>

    <!-- Denomination Text -->
    <text x="50" y="55.5" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="-0.5">20</text>

    <!-- Top & Bottom Micro-Text -->
    <text x="50" y="32" font-family="'Inter', Arial, sans-serif" font-size="5" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="1" opacity="0.75">VIP</text>
    <text x="50" y="70" font-family="'Inter', Arial, sans-serif" font-size="4" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="0.5" opacity="0.65">CASINO</text>

    <!-- Realistic 3D Glass Crystal Glare -->
    <path d="M 24 38 Q 50 18 76 38 A 28 28 0 0 0 24 38 Z" fill="rgba(255, 255, 255, 0.45)" pointer-events="none"/>
  </g>
</svg>
