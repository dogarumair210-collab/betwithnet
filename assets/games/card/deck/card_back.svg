<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 290" width="200" height="290">
  <defs>
    <!-- Outer Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Rich Velvet Gradient -->
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="35%" stop-color="#7f1d1d"/>
      <stop offset="70%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Intricate Casino Diamond Guilloche Pattern -->
    <pattern id="casinoGuilloche" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 16 8 L 8 16 L 0 8 Z" fill="none" stroke="#ca8a04" stroke-width="0.75" opacity="0.4"/>
      <circle cx="8" cy="8" r="2.2" fill="#ca8a04" opacity="0.3"/>
      <path d="M 0 0 L 16 16 M 16 0 L 0 16" stroke="#ca8a04" stroke-width="0.3" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Base Card Body with rounded corners -->
  <rect x="2" y="2" width="196" height="286" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Inner Margin White Border -->
  <rect x="8" y="8" width="184" height="274" rx="8" fill="url(#backGrad)"/>

  <!-- Guilloche Pattern Fill -->
  <rect x="8" y="8" width="184" height="274" rx="8" fill="url(#casinoGuilloche)"/>

  <!-- Ornate Double Gold Inlay Border -->
  <rect x="14" y="14" width="172" height="262" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <rect x="18" y="18" width="164" height="254" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.8"/>

  <!-- 4 Corner Casino Crests -->
  <!-- Top-Left -->
  <g transform="translate(22, 22)">
    <path d="M 0 0 L 12 0 C 12 6, 6 12, 0 12 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <circle cx="4" cy="4" r="1.5" fill="#fef08a"/>
  </g>
  <!-- Top-Right -->
  <g transform="translate(178, 22) scale(-1, 1)">
    <path d="M 0 0 L 12 0 C 12 6, 6 12, 0 12 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <circle cx="4" cy="4" r="1.5" fill="#fef08a"/>
  </g>
  <!-- Bottom-Left -->
  <g transform="translate(22, 268) scale(1, -1)">
    <path d="M 0 0 L 12 0 C 12 6, 6 12, 0 12 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <circle cx="4" cy="4" r="1.5" fill="#fef08a"/>
  </g>
  <!-- Bottom-Right -->
  <g transform="translate(178, 268) scale(-1, -1)">
    <path d="M 0 0 L 12 0 C 12 6, 6 12, 0 12 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <circle cx="4" cy="4" r="1.5" fill="#fef08a"/>
  </g>

  <!-- Center Luxury Medallion -->
  <circle cx="100" cy="145" r="42" fill="#2d0505" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="145" r="37" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.9"/>
  <circle cx="100" cy="145" r="33" fill="#170202"/>

  <!-- 4 Aces & Suits Emblem in Center -->
  <g transform="translate(100, 145)">
    <!-- Spades Crown -->
    <path d="M 0 -18 C -7 -6, -14 -4, -14 3 C -14 9, -7 13, 0 8 C 7 13, 14 9, 14 3 C 14 -4, 7 -6, 0 -18 Z" fill="url(#goldGrad)"/>
    <polygon points="-2,7 2,7 4,14 -4,14" fill="url(#goldGrad)"/>
    
    <!-- Stars -->
    <polygon points="0,-24 2,-20 6,-20 3,-17 4,-13 0,-15 -4,-13 -3,-17 -6,-20 -2,-20" fill="#fef08a"/>
  </g>

  <!-- Ribbon Text Top & Bottom -->
  <text x="100" y="86" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2.5">BET WITH NET</text>
  <text x="100" y="206" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3" opacity="0.85">VIP CLUB</text>

  <!-- Glass Sheen Overlay -->
  <path d="M 10 10 L 190 10 L 80 278 L 10 278 Z" fill="rgba(255, 255, 255, 0.04)" pointer-events="none"/>
</svg>
