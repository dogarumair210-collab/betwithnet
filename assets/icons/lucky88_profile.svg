<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer Gold Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#c69214"/>
      <stop offset="75%" stop-color="#fff099"/>
      <stop offset="100%" stop-color="#8a6500"/>
    </linearGradient>

    <!-- Inner Radial Pearl Surface -->
    <radialGradient id="pearlWhiteBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <!-- 3D Gold Number Gradient -->
    <linearGradient id="gold88" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff3a8"/>
      <stop offset="45%" stop-color="#ffcc00"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a5a00"/>
    </linearGradient>

    <!-- Pearl Bead Gradient -->
    <radialGradient id="pearlOrb" cx="30%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <!-- Gold Bead Gradient -->
    <radialGradient id="goldOrb" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="80%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#6b4c00"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ffd700" flood-opacity="0.75"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#5a3d00" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="100" cy="100" r="96" fill="#0b0e14" filter="url(#glow3d)"/>

  <!-- Golden Beaded Outer Rim -->
  <circle cx="100" cy="100" r="94" fill="url(#goldRim)"/>
  <circle cx="100" cy="100" r="88" fill="#1e293b"/>

  <!-- Inner Pearl White Disc -->
  <circle cx="100" cy="100" r="84" fill="url(#pearlWhiteBg)"/>

  <!-- Concentric Lucky Gold Rings -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.9"/>
  <circle cx="100" cy="100" r="69" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.65"/>

  <!-- Outer Ring Pearls & Gold Jewels -->
  <circle cx="100" cy="19" r="5" fill="url(#goldOrb)"/>
  <circle cx="181" cy="100" r="5" fill="url(#goldOrb)"/>
  <circle cx="100" cy="181" r="5" fill="url(#goldOrb)"/>
  <circle cx="19" cy="100" r="5" fill="url(#goldOrb)"/>

  <circle cx="42" cy="42" r="4.5" fill="url(#pearlOrb)"/>
  <circle cx="158" cy="42" r="4.5" fill="url(#pearlOrb)"/>
  <circle cx="158" cy="158" r="4.5" fill="url(#pearlOrb)"/>
  <circle cx="42" cy="158" r="4.5" fill="url(#pearlOrb)"/>

  <!-- Royal Crown Crest at Top -->
  <g transform="translate(100, 44) scale(0.7)" filter="url(#goldGlow)">
    <path d="M-22,7 L-13,-9 L0,-3 L13,-9 L22,7 Z" fill="url(#goldRim)"/>
    <circle cx="0" cy="-3" r="3.5" fill="#ffffff"/>
    <circle cx="-13" cy="-9" r="2.8" fill="#ffd700"/>
    <circle cx="13" cy="-9" r="2.8" fill="#ffd700"/>
  </g>

  <!-- Big Bold 3D "88" Central Lucky Typography (Centered - NO name banner/popup underneath) -->
  <!-- Shadow Base -->
  <text x="100" y="125" 
        font-family="'Cinzel', 'Arial Black', sans-serif" 
        font-size="75" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="-1" 
        fill="#2d1c00" 
        opacity="0.35"
        transform="translate(2, 4)">88</text>

  <!-- Stroke Outline -->
  <text x="100" y="125" 
        font-family="'Cinzel', 'Arial Black', sans-serif" 
        font-size="75" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="-1" 
        fill="none" 
        stroke="#785002" 
        stroke-width="5" 
        stroke-linejoin="round">88</text>

  <!-- Main Metallic Gold 88 -->
  <text x="100" y="125" 
        font-family="'Cinzel', 'Arial Black', sans-serif" 
        font-size="75" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="-1" 
        fill="url(#gold88)"
        filter="url(#textShadow)">88</text>

  <!-- Specular Shimmer Core on 88 -->
  <text x="98.5" y="123.5" 
        font-family="'Cinzel', 'Arial Black', sans-serif" 
        font-size="75" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="-1" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.3" 
        opacity="0.8">88</text>

  <!-- Bottom Trio of Lucky Gold & Pearl Beads (Balanced decoration - NO name badge/text) -->
  <circle cx="82" cy="155" r="4" fill="url(#goldOrb)"/>
  <circle cx="100" cy="158" r="5" fill="url(#pearlOrb)" filter="url(#goldGlow)"/>
  <circle cx="118" cy="155" r="4" fill="url(#goldOrb)"/>

  <!-- Sparkle Stars -->
  <g transform="translate(62, 74) scale(0.65)">
    <path d="M0,-8 L2.5,-2.5 L8,0 L2.5,2.5 L0,8 L-2.5,2.5 L-8,0 L-2.5,-2.5 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(138, 78) scale(0.75)">
    <path d="M0,-8 L2.5,-2.5 L8,0 L2.5,2.5 L0,8 L-2.5,2.5 L-8,0 L-2.5,-2.5 Z" fill="#ffd700"/>
  </g>
</svg>
