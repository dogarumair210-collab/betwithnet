<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdrawal Center - Bet With Net</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/app.css?v=2026_deposit_popup_v1">
    <link rel="stylesheet" href="css/cashier.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="js/site_settings.js"></script>
    <script src="js/payment_manager.js"></script>
</head>
<body class="cashier-page">

    <div id="app-header-slot"></div>

    <main class="cashier-container">

        <!-- Cashier Header -->
        <div class="cashier-header-card">
            <div>
                <div class="cashier-balance-label">Available for Cashout</div>
                <div class="cashier-balance-val wallet-balance-display">₨ 25,000.00</div>
            </div>
            <div>
                <a href="deposit.html" class="btn-deposit-quick" style="text-decoration:none;">Add Funds ➕</a>
            </div>
        </div>

        <div class="cashier-tabs">
            <a href="deposit.html" class="cashier-tab-btn">💳 Deposit</a>
            <a href="withdraw.html" class="cashier-tab-btn active">💸 Withdraw</a>
            <a href="history.html" class="cashier-tab-btn">📋 Payment History</a>
        </div>

        <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:20px; margin-bottom:20px;">
            <h2 style="font-size:16px; font-weight:800; margin-bottom:14px;">Instant Withdrawal Request</h2>

            <div class="form-group">
                <label class="form-label">Withdrawal Method:</label>
                <select id="w-method" class="form-select">
                    <option value="EasyPaisa">EasyPaisa (0-30 mins)</option>
                    <option value="JazzCash">JazzCash (0-30 mins)</option>
                    <option value="Bank Transfer">Bank Transfer (All Pakistani Banks)</option>
                    <option value="USDT">Crypto USDT (TRC-20)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Account Title (Must Match Verification Name):</label>
                <input type="text" id="w-title" class="form-input" placeholder="e.g. Muhammad Ali">
            </div>

            <div class="form-group">
                <label class="form-label">Account Number / IBAN / Wallet Address:</label>
                <input type="text" id="w-account" class="form-input" placeholder="0312-XXXXXXX or IBAN">
            </div>

            <div class="form-group">
                <label class="form-label">Amount to Withdraw (Min ₨ 500):</label>
                <input type="number" id="w-amount" class="form-input" value="3000" min="500" step="100">
                <div class="quick-amounts">
                    <button class="btn-quick-amount" onclick="document.getElementById('w-amount').value = 1000">₨ 1,000</button>
                    <button class="btn-quick-amount" onclick="document.getElementById('w-amount').value = 5000">₨ 5,000</button>
                    <button class="btn-quick-amount" onclick="document.getElementById('w-amount').value = 10000">₨ 10,000</button>
                    <button class="btn-quick-amount" onclick="document.getElementById('w-amount').value = window.wallet.getBalance()">ALL BALANCE</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Security PIN (Default: 1234):</label>
                <input type="password" id="w-pin" class="form-input" value="1234" maxlength="6">
            </div>

            <button id="w-submit-btn" class="btn-submit-action" onclick="submitWithdrawal()">
                <span>SUBMIT WITHDRAWAL REQUEST</span> <span>⚡</span>
            </button>
        </div>

        <!-- Clearance Tracking Timeline -->
        <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:16px;">
            <div style="font-size:13px; font-weight:700; color:#8e9bb0; margin-bottom:12px;">Automatic Processing Pipeline:</div>
            <div class="timeline-tracker">
                <div class="timeline-step active">
                    <div class="timeline-step-circle">1</div>
                    <span>Submitted</span>
                </div>
                <div class="timeline-step active">
                    <div class="timeline-step-circle">2</div>
                    <span>PIN Verified</span>
                </div>
                <div class="timeline-step active">
                    <div class="timeline-step-circle">3</div>
                    <span>Bank Dispatch</span>
                </div>
                <div class="timeline-step active">
                    <div class="timeline-step-circle">4</div>
                    <span>Approved</span>
                </div>
            </div>
            <div style="font-size:11px; color:#8e9bb0; text-align:center;">
                Simulated banking pipeline guarantees 100% test clearance.
            </div>
        </div>

    </main>

    <script src="js/audio.js?v=2.2"></script>
    <script src="js/wallet.js?v=2.2"></script>
    <script src="js/api_bridge.js?v=2.2"></script>
    <script src="js/core.js?v=2026_hd_vault_v1"></script>
    <script>
        let isWithdrawLocked = false;

        document.addEventListener('DOMContentLoaded', async () => {
            window.core.init('withdraw');
            initWithdrawMethods();
            const user = (window.core && window.core.getLoggedInUser) ? window.core.getLoggedInUser() : null;
            if (user && user.id) {
                if (window.core.syncServerBalance) {
                    await window.core.syncServerBalance(user.id);
                }
                await checkWithdrawalStatus(user.id);
            }
            updateCashierBalanceDisplay();
        });

        async function checkWithdrawalStatus(userId) {
            if (!userId) return;
            try {
                const res = await fetch(`/api/wallet.php?action=balance&user_id=${encodeURIComponent(userId)}`);
                const json = await res.json();
                if (json && json.success && json.data) {
                    isWithdrawLocked = !!json.data.withdraw_locked;
                }
            } catch (e) {
                console.warn('Failed to check withdraw status:', e);
            }
        }

        function updateCashierBalanceDisplay() {
            if (!window.wallet) return;
            const rate = window.wallet.exchangeRate || 280;
            const pkr = parseFloat(window.wallet.state.balancePKR !== undefined ? window.wallet.state.balancePKR : (window.wallet.state.balanceUSD * rate)) || 0;
            document.querySelectorAll('.cashier-balance-val').forEach(el => {
                el.innerText = `₨ ${Number(pkr).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            });
        }

        function initWithdrawMethods() {
            const select = document.getElementById('w-method');
            const methods = window.paymentManager ? window.paymentManager.getWithdrawMethods(true) : [];
            if (methods.length > 0 && select) {
                select.innerHTML = methods.map(m => `
                    <option value="${m.name}">${m.icon || '💸'} ${m.name} (${m.processingTime || '15-30m'}) - Min ₨ ${Number(m.minWithdraw).toLocaleString()}</option>
                `).join('');
            }
        }

        async function submitWithdrawal() {
            const user = (window.core && window.core.getLoggedInUser) ? window.core.getLoggedInUser() : null;
            if (!user || !user.id) {
                window.core.showToast('Please sign in or create an account before requesting withdrawal!', 'error');
                if (window.core.openAuthModal) window.core.openAuthModal('login');
                return;
            }

            if (isWithdrawLocked) {
                window.core.showToast('Withdrawal ke liye kam az kam 1 deposit hona chahiye! Pehle 1 deposit karein taake withdrawal ho sake.', 'error');
                return;
            }

            const method = document.getElementById('w-method').value;
            const title = document.getElementById('w-title').value.trim();
            const account = document.getElementById('w-account').value.trim();
            const amount = parseFloat(document.getElementById('w-amount').value);
            const btn = document.getElementById('w-submit-btn');

            if (!title || !account) {
                window.core.showToast('Please enter account title and account number', 'error');
                return;
            }
            if (!amount || amount < 500) {
                window.core.showToast('Minimum withdrawal amount is ₨ 500', 'error');
                return;
            }

            const rate = (window.wallet && window.wallet.exchangeRate) ? window.wallet.exchangeRate : 280;
            const availablePKR = window.wallet ? parseFloat(window.wallet.state.balancePKR !== undefined ? window.wallet.state.balancePKR : (window.wallet.state.balanceUSD * rate)) : 0;
            if (amount > availablePKR) {
                window.core.showToast(`Insufficient balance! Your available balance is ₨ ${Number(availablePKR).toLocaleString()}`, 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Submitting Withdrawal Request...';

            try {
                const res = await fetch('/api/wallet.php?action=withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        user_id: user.id,
                        username: user.username || user.fullName || user.phone || 'Player',
                        phone: user.phone || account,
                        amount: amount,
                        amount_pkr: amount,
                        currency: 'PKR',
                        method: method,
                        account_title: title,
                        account_number: account
                    })
                });
                const json = await res.json();
                if (!json.success) {
                    throw new Error(json.message || 'Withdrawal submission failed.');
                }

                const txId = (json.data && json.data.transaction_id) ? json.data.transaction_id : ('WTH-' + Date.now().toString().slice(-6));

                // Deduct from local wallet
                if (window.wallet) {
                    const rate = window.wallet.exchangeRate || 280;
                    const usdDed = amount / rate;
                    window.wallet.state.balancePKR = Math.max(0, (window.wallet.state.balancePKR || 0) - amount);
                    window.wallet.state.balanceUSD = Math.max(0, (window.wallet.state.balanceUSD || 0) - usdDed);

                    if (!window.wallet.state.transactions) window.wallet.state.transactions = [];
                    window.wallet.state.transactions.unshift({
                        id: txId,
                        type: 'withdraw',
                        method: method,
                        currency: 'PKR',
                        amountPKR: amount,
                        amountUSD: usdDed,
                        accountTitle: title,
                        accountNumber: account,
                        status: 'Pending',
                        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                        timestamp: new Date().toISOString()
                    });
                    window.wallet.saveState();
                }

                btn.disabled = false;
                // Broadcast to Admin Panel for instantaneous modal alert
                try {
                    localStorage.setItem('bwn_latest_tx_broadcast', JSON.stringify({
                        id: txId,
                        type: 'withdraw',
                        amount: amount,
                        amount_pkr: amount,
                        amount_usd: amount / 280,
                        method: method,
                        sender_account: account,
                        user_id: user.username,
                        trx_id: txId,
                        timestamp: Date.now()
                    }));
                } catch(e) {}

                // Public notification - standard toast message (no intrusive modal on player screen)
                window.core.showToast(`Withdrawal of ₨ ${amount.toLocaleString()} submitted! Status: Pending Admin Approval.`, 'success');

                window.core.updateAllBalances();
                setTimeout(() => {
                    window.location.href = 'history.html';
                }, 1800);
            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'SUBMIT WITHDRAWAL REQUEST';
                window.core.showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
