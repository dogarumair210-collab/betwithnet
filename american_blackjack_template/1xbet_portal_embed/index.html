<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet Casino - American Blackjack (Game 48844)</title>
    <link rel="stylesheet" href="../../css/app.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #0b1a2d;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1xBet Portal Top Bar */
        .portal-header {
            height: 60px;
            background: linear-gradient(180deg, #0e2b4f 0%, #091d36 100%);
            border-bottom: 2px solid #1a4a82;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .portal-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .portal-logo {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .portal-logo span {
            color: #2196f3;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-link {
            color: #9cb3ce;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .nav-link.active, .nav-link:hover {
            color: #fff;
            background: rgba(33, 150, 243, 0.2);
        }

        .portal-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .wallet-pill {
            background: #061527;
            border: 1px solid #1e4570;
            border-radius: 20px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wallet-label {
            font-size: 11px;
            color: #8da4be;
            text-transform: uppercase;
        }

        .wallet-amount {
            font-size: 15px;
            font-weight: 800;
            color: #4caf50;
            font-family: monospace;
        }

        .btn-deposit {
            background: linear-gradient(180deg, #4caf50 0%, #388e3c 100%);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Sub-Header Breadcrumb & Game Meta */
        .game-bar {
            height: 44px;
            background: #071626;
            border-bottom: 1px solid #132a45;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 13px;
        }

        .game-breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8da4be;
        }

        .game-breadcrumbs a {
            color: #2196f3;
            text-decoration: none;
        }

        .game-breadcrumbs strong {
            color: #fff;
        }

        .game-tools {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-badge {
            background: #e65100;
            color: #fff;
            font-weight: 800;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .tool-btn {
            background: transparent;
            border: 1px solid #20456e;
            color: #8da4be;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tool-btn:hover {
            color: #fff;
            border-color: #2196f3;
        }

        /* Game Frame Container */
        .game-viewport {
            flex: 1;
            position: relative;
            background: #000;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- 1xBet Main Top Header -->
    <header class="portal-header">
        <div class="portal-left">
            <a href="../../casino.html" class="portal-logo">1X<span>BET</span></a>
            <nav class="nav-links">
                <a href="../../index.html" class="nav-link">Sports</a>
                <a href="../../casino.html" class="nav-link active">Casino</a>
                <a href="../../casino.html" class="nav-link">Live Casino</a>
                <a href="../../games/crash.html" class="nav-link">1xGames</a>
            </nav>
        </div>

        <div class="portal-right">
            <div class="wallet-pill">
                <span class="wallet-label">Main Account:</span>
                <span class="wallet-amount">₨ 50,000</span>
            </div>
            <button class="btn-deposit" onclick="alert('Demo Mode - Account Funded!')">Deposit</button>
        </div>
    </header>

    <!-- Game Information Sub-Bar -->
    <div class="game-bar">
        <div class="game-breadcrumbs">
            <a href="../../casino.html">Casino</a>
            <span>/</span>
            <a href="../../casino.html">Table Games</a>
            <span>/</span>
            <strong>American Blackjack</strong>
            <span class="game-badge">PRAGMATIC PLAY</span>
        </div>

        <div class="game-tools">
            <span style="color:#64748b;">Game ID: 48844</span>
            <button class="tool-btn" onclick="toggleIframeFullscreen()">⛶ Full Screen</button>
        </div>
    </div>

    <!-- Live Game Frame -->
    <div class="game-viewport">
        <iframe id="game-frame" class="game-iframe" src="../standalone_game/index.html" allowfullscreen></iframe>
    </div>

    <script>
        function toggleIframeFullscreen() {
            const frame = document.getElementById('game-frame');
            if (frame.requestFullscreen) {
                frame.requestFullscreen();
            } else if (frame.webkitRequestFullscreen) {
                frame.webkitRequestFullscreen();
            }
        }
    </script>
</body>
</html>
