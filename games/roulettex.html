<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RouletteX VIP 500x - European Roulette Studio | Bet With Net</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/games.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

    <style>
        :root {
            --bg-deep: #050a12;
            --bg-surface: #0a1320;
            --bg-card: #111d30;
            --bg-elevated: #1a2b44;
            --border: #223755;
            --border-glow: rgba(0, 220, 130, 0.4);
            --accent: #00dc82;
            --accent-gold: #ffbe2e;
            --accent-red: #e73636;
            --accent-blue: #1c8ffa;
            --text-primary: #ffffff;
            --text-secondary: #8fa3c0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(10, 19, 32, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            height: 58px;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: var(--bg-elevated);
            border-color: var(--accent);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo-img {
            height: 26px;
            object-fit: contain;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .badge-500x {
            background: linear-gradient(135deg, #e73636, #ff4757);
            color: #fff;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(231, 54, 54, 0.5);
            white-space: nowrap;
        }

        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            align-items: center;
            background: rgba(5, 10, 18, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
            gap: 4px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #fff;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
            box-shadow: 0 2px 10px rgba(28, 143, 250, 0.4);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .balance-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(5, 10, 18, 0.9);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        .balance-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .balance-val {
            color: var(--accent-gold);
            font-weight: 800;
            font-size: 15px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .ctrl-btn:hover {
            background: var(--bg-elevated);
        }

        /* Viewport Panels */
        .content-area {
            position: relative;
            flex: 1;
            width: 100%;
            height: calc(100vh - 58px);
            overflow: hidden;
        }

        .view-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .view-panel.active {
            display: flex;
        }

        /* 1. Full Live Client Frame */
        #frameView {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* 2. 3D Studio & Table Mode */
        #viewStudio {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: #02050c;
            padding: 12px 16px 20px;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Animated Luxury Casino Background Template */
        .casino-bg-stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(ellipse at 50% 25%, #162447 0%, #0c142b 45%, #030611 100%);
        }

        /* Volumetric Ceiling Beams (Moving Casino Lights) */
        .casino-beam {
            position: absolute;
            top: -25%;
            width: 320px;
            height: 160%;
            transform-origin: top center;
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(24px);
        }

        .casino-beam.beam-1 {
            left: 10%;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.38) 0%, rgba(255, 160, 0, 0.12) 55%, transparent 95%);
            animation: sweepBeam1 13s ease-in-out infinite alternate;
        }

        .casino-beam.beam-2 {
            right: 12%;
            background: linear-gradient(180deg, rgba(0, 180, 255, 0.32) 0%, rgba(65, 105, 225, 0.1) 50%, transparent 95%);
            animation: sweepBeam2 15s ease-in-out infinite alternate;
        }

        .casino-beam.beam-3 {
            left: 50%;
            margin-left: -120px;
            width: 240px;
            background: linear-gradient(180deg, rgba(255, 230, 130, 0.28) 0%, rgba(218, 165, 32, 0.08) 50%, transparent 95%);
            animation: sweepBeam3 10s ease-in-out infinite alternate;
        }

        @keyframes sweepBeam1 {
            0% { transform: rotate(-22deg) scaleX(0.85); opacity: 0.25; }
            50% { transform: rotate(10deg) scaleX(1.15); opacity: 0.6; }
            100% { transform: rotate(25deg) scaleX(0.9); opacity: 0.3; }
        }

        @keyframes sweepBeam2 {
            0% { transform: rotate(24deg) scaleX(0.9); opacity: 0.3; }
            50% { transform: rotate(-8deg) scaleX(1.2); opacity: 0.65; }
            100% { transform: rotate(-22deg) scaleX(0.85); opacity: 0.25; }
        }

        @keyframes sweepBeam3 {
            0% { transform: rotate(-6deg); opacity: 0.25; }
            50% { transform: rotate(6deg); opacity: 0.55; }
            100% { transform: rotate(-10deg); opacity: 0.3; }
        }

        /* Moving Ambient Casino Spotlight Glow */
        .casino-ambient-glow {
            position: absolute;
            width: 140%;
            height: 140%;
            top: -20%;
            left: -20%;
            background: 
                radial-gradient(circle at 25% 30%, rgba(255, 200, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 75% 35%, rgba(0, 150, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(220, 20, 60, 0.09) 0%, transparent 45%);
            animation: casinoGlowBreath 12s ease-in-out infinite alternate;
            filter: blur(40px);
            pointer-events: none;
        }

        @keyframes casinoGlowBreath {
            0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
            50% { transform: scale(1.08) rotate(3deg); opacity: 1; }
            100% { transform: scale(0.95) rotate(-3deg); opacity: 0.8; }
        }

        /* Luxury Casino Geometric Pattern */
        .casino-lux-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(rgba(255, 215, 0, 0.14) 1px, transparent 1px),
                linear-gradient(45deg, rgba(255, 255, 255, 0.015) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.015) 75%),
                linear-gradient(45deg, rgba(255, 255, 255, 0.015) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.015) 75%);
            background-size: 32px 32px, 64px 64px, 64px 64px;
            background-position: 0 0, 0 0, 32px 32px;
            opacity: 0.55;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* Floating Casino Canvas (Particles, Stars & Suits) */
        #casinoBgCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .studio-layout-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1360px;
            position: relative;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            transform-origin: center center;
        }

        .studio-col-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            width: 326px;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 20;
        }

        .studio-col-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 920px;
            transition: opacity 0.6s ease, filter 0.6s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Roulette 3D Wheel Stage */
        .wheel-3d-box {
            position: relative;
            width: 326px;
            height: 326px;
            background: radial-gradient(circle, #2d1606 0%, #0c0502 100%);
            border-radius: 50%;
            border: 4px solid #b8860b;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.45), 0 10px 30px rgba(0, 0, 0, 0.95), inset 0 0 25px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.8s ease;
            transform-origin: center center;
        }

        /* Cinematic Camera Focus on Wheel during Spin - Ultra HD Wheel Focus */
        #viewStudio.wheel-zoom-active .studio-layout-container {
            transform: translateX(30%) scale(1.15);
        }

        #viewStudio.wheel-zoom-active .wheel-3d-box {
            transform: scale(1.6);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.95), 0 0 150px rgba(255, 170, 0, 0.55), 0 30px 70px rgba(0, 0, 0, 0.98);
            z-index: 100;
        }

        #viewStudio.wheel-zoom-active .multipliers-box {
            opacity: 0.15;
            filter: blur(2px);
            pointer-events: none;
        }

        #viewStudio.wheel-zoom-active .studio-col-right {
            opacity: 0;
            filter: blur(5px);
            pointer-events: none;
            transform: scale(0.92) translateX(40px);
        }

        #studioWheelCanvas {
            width: 318px;
            height: 318px;
            border-radius: 50%;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .wheel-pin-top {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid #ffd700;
            filter: drop-shadow(0 0 10px #ffea00) drop-shadow(0 3px 6px rgba(0,0,0,0.95));
            z-index: 50;
            pointer-events: none;
        }

        /* Lucky Multipliers HUD */
        .multipliers-box {
            flex: 1;
            min-width: 300px;
            max-width: 550px;
            background: rgba(10, 19, 32, 0.92);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .mult-grid-inner {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .mult-pill {
            background: rgba(5, 10, 18, 0.95);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .mult-num-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 900;
        }

        .mult-val-text {
            font-size: 13px;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .mult-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mult-title {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            color: var(--accent-gold);
            font-weight: 900;
        }

        .mult-badge {
            font-size: 11px;
            background: rgba(255, 190, 46, 0.2);
            color: var(--accent-gold);
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 700;
        }

        .history-bar {
            background: rgba(5, 10, 18, 0.6);
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hist-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        /* 3D Felt Layout */
        .felt-board-wrapper {
            width: 100%;
            max-width: 1300px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .felt-board {
            min-width: 860px;
            background: 
                radial-gradient(ellipse at 50% 50%, rgba(10, 77, 46, 0.95) 0%, rgba(5, 41, 24, 0.98) 100%),
                url('../game_assets/textures/Roulette_Table_BaseColor_Green.webp');
            background-size: cover;
            border-radius: 16px;
            border: 4px solid #111d30;
            box-shadow: 0 0 0 1px rgba(255, 190, 46, 0.3), 0 20px 60px rgba(0,0,0,0.8);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .board-top-row {
            display: flex;
            gap: 6px;
        }

        .zero-btn {
            width: 58px;
            background: #117a47;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 8px 0 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }

        .zero-btn:hover {
            filter: brightness(1.2);
        }

        .grid-3x12 {
            flex: 1;
            display: grid;
            grid-template-rows: repeat(3, 44px);
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
        }

        .num-slot {
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 800;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, filter 0.1s;
        }

        .num-slot:hover {
            filter: brightness(1.25);
            transform: scale(1.02);
        }

        .num-slot.red { background: #b71c1c; }
        .num-slot.black { background: #1a1a1a; }

        .has-chip::after {
            content: attr(data-val);
            position: absolute;
            background: var(--accent-gold);
            color: #000;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 900;
            min-width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.8);
            z-index: 5;
            padding: 0 2px;
        }

        /* Outside bets rows */
        .outside-row {
            display: flex;
            gap: 6px;
            margin-left: 64px;
        }

        .outside-btn {
            flex: 1;
            height: 38px;
            background: rgba(5, 41, 24, 0.9);
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }

        .outside-btn:hover {
            filter: brightness(1.3);
        }

        .outside-btn.red { background: #b71c1c; }
        .outside-btn.black { background: #1a1a1a; }

        /* Chips Controls */
        .studio-controls {
            width: 100%;
            max-width: 1300px;
            background: rgba(10, 19, 32, 0.95);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .chips-list {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
        }

        .chip-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px dashed rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .chip-circle.selected {
            transform: scale(1.15) translateY(-3px);
            border: 3px solid var(--accent-gold);
            box-shadow: 0 0 16px rgba(255, 190, 46, 0.7);
        }

        .c-05 { background: radial-gradient(circle, #f0f0f0 40%, #7f8c8d 100%); color: #2c3e50; }
        .c-1 { background: radial-gradient(circle, #f4f6f7 40%, #2980b9 100%); color: #1a5276; }
        .c-2 { background: radial-gradient(circle, #fadbd8 45%, #c0392b 100%); color: #78281f; }
        .c-5 { background: radial-gradient(circle, #d4efdf 45%, #27ae60 100%); color: #145a32; }
        .c-10 { background: radial-gradient(circle, #f2f2f2 40%, #1d3fd6 100%); color: #1d3fd6; }
        .c-50 { background: radial-gradient(circle, #d62222 45%, #8b0000 100%); color: #fff; }
        .c-100 { background: radial-gradient(circle, #14875a 45%, #084d31 100%); color: #fff; }
        .c-500 { background: radial-gradient(circle, #2547d8 45%, #0e248a 100%); color: #fff; }
        .c-1000 { background: radial-gradient(circle, #2c2f36 45%, #121418 100%); color: #ffbe2e; }
        .c-5000 { background: radial-gradient(circle, #8b3fe8 45%, #50139b 100%); color: #fff; }

        .live-wooden-rail-cover {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 44px;
            background: linear-gradient(180deg, rgba(16, 25, 38, 0.98) 0%, rgba(6, 10, 18, 0.99) 100%);
            border-top: 1px solid rgba(255, 190, 46, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 60;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.8);
        }

        .btn-spin-now {
            background: linear-gradient(135deg, #00dc82, #00a862);
            color: #031023;
            border: none;
            padding: 12px 36px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 220, 130, 0.4);
            transition: all 0.2s;
        }

        .btn-spin-now:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 25px rgba(0, 220, 130, 0.6);
        }

        /* 3. Full Asset & Graphic Vault Panel */
        #viewVault {
            flex-direction: column;
            overflow-y: auto;
            background: var(--bg-deep);
            padding: 24px 30px;
            gap: 24px;
        }

        .vault-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .vault-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .vault-count {
            background: rgba(255, 190, 46, 0.15);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .vault-category-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;

    <script>
        // Bet With Net Wallet Sync Engine
        async function fetchServerBalance() {
            if (typeof studioSpinning !== 'undefined' && studioSpinning) return;
            if (window.wallet && window.wallet._lastBetTime && (Date.now() - window.wallet._lastBetTime < 6000)) return;
            try {
                let user = null;
                const sess = localStorage.getItem('bwn_session_user');
                if (sess) {
                    try { user = JSON.parse(sess); } catch(e) {}
                }
                
                // If not in session, check auth API
                if (!user || !user.id) {
                    try {
                        const authRes = await fetch('/api/auth.php?action=me', { credentials: 'include' });
                        if (authRes.ok) {
                            const authData = await authRes.json();
                            if (authData && authData.success && authData.data) {
                                user = authData.data;
                                localStorage.setItem('bwn_session_user', JSON.stringify(user));
                            }
                        }
                    } catch(e) {}
                }

                if (user && user.id) {
                    const res = await fetch(`/api/wallet.php?action=balance&user_id=${encodeURIComponent(user.id)}`, { cache: 'no-store', credentials: 'include' });
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.success && json.data) {
                            const balPkr = parseFloat(json.data.balance_pkr || 0);
                            const balUsd = parseFloat(json.data.balance_usd || (balPkr / 280));
                            if (window.wallet) {
                                window.wallet.state.balancePKR = balPkr;
                                window.wallet.state.balanceUSD = balUsd;
                                window.wallet.saveState();
                            }
                        }
                    }
                }
            } catch(e) {
                console.warn('Live balance fetch error:', e);
            }
            syncWallet();
        }

        function syncWallet() {
            try {
                let bal = 0;
                let sym = '₨ ';
                let curr = 'PKR';
                let balUSD = 0;
                const rate = (window.wallet && window.wallet.exchangeRate) ? window.wallet.exchangeRate : 280;

                if (window.wallet && typeof window.wallet.getBalance === 'function') {
                    bal = window.wallet.getBalance();
                    sym = window.wallet.getCurrencySymbol ? window.wallet.getCurrencySymbol() : '₨ ';
                    curr = window.wallet.getCurrency ? window.wallet.getCurrency() : 'PKR';
                    balUSD = window.wallet.toUSD ? window.wallet.toUSD(bal) : (bal / rate);
                } else if (localStorage.getItem('bwn_session_user')) {
                    try {
                        const u = JSON.parse(localStorage.getItem('bwn_session_user'));
                        bal = parseFloat(u.balance_pkr !== undefined ? u.balance_pkr : (u.balancePKR || 0));
                        balUSD = parseFloat(u.balance_usd !== undefined ? u.balance_usd : (bal / rate));
                    } catch(e) {}
                } else if (localStorage.getItem('bwn_wallet_state_v1')) {
                    try {
                        const st = JSON.parse(localStorage.getItem('bwn_wallet_state_v1'));
                        bal = parseFloat(st.balancePKR || 0);
                        balUSD = parseFloat(st.balanceUSD || (bal / rate));
                    } catch(e) {}
                }

                const formattedPKR = `${sym}${Number(bal).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                const formattedUSDT = `${Number(balUSD).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USDT`;

                // Top Header Balance
                const topEl = document.getElementById('topWalletBalance');
                if (topEl) topEl.textContent = formattedPKR;
                const dualEl = document.getElementById('topWalletDualBalance');
                if (dualEl) dualEl.textContent = `(${formattedUSDT})`;

                // 3D VIP Studio Table Balance (Directly below table in Studio mode)
                const tablePKR = document.getElementById('tableWalletBalPKR');
                if (tablePKR) tablePKR.textContent = formattedPKR;
                const tableUSDT = document.getElementById('tableWalletBalUSDT');
                if (tableUSDT) tableUSDT.textContent = formattedUSDT;

            } catch (e) {
                console.log('Wallet sync handled:', e);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function showWinToast(msg) {
            const t = document.getElementById('winToast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3800);
        }

        // Screen Orientation & Rotation Control
        function toggleScreenRotation() {
            const body = document.body;
            if (body.classList.contains('force-portrait')) {
                body.classList.remove('force-portrait');
                body.classList.add('force-landscape');
                try { localStorage.setItem('roulette_rot', 'landscape'); } catch(e) {}
            } else if (body.classList.contains('force-landscape')) {
                body.classList.remove('force-landscape');
                body.classList.add('force-portrait');
                try { localStorage.setItem('roulette_rot', 'portrait'); } catch(e) {}
            } else {
                body.classList.add('force-portrait');
                try { localStorage.setItem('roulette_rot', 'portrait'); } catch(e) {}
            }
        }

        try {
            const savedRot = localStorage.getItem('roulette_rot');
            if (savedRot === 'portrait') document.body.classList.add('force-portrait');
            else if (savedRot === 'landscape') document.body.classList.add('force-landscape');
        } catch(e) {}

        // Vault Sounds
        const vaultSounds = {
            bg: new Howl({ src: ['../game_assets/audio_sounds/bg_ambience.mp3'], volume: 0.5 }),
            spin: new Howl({ src: ['../game_assets/audio_sounds/wheel_spin.mp3'], volume: 0.6 }),
            chip: new Howl({ src: ['../game_assets/audio_sounds/chip_place.mp3'], volume: 0.6 }),
            win: new Howl({ src: ['../game_assets/audio_sounds/win.mp3'], volume: 0.7 }),
            ball1: new Howl({ src: ['../game_assets/audio_sounds/ball-click-1.mp3'], volume: 0.6 })
        };

        // Studio Wheel Simulation
        const ROULETTE_ORDER = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const RED_NUMS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
        let studioInitialized = false;
        let studioChip = 1;
        let studioBets = {}; // num -> amount
        let currentMultipliers = []; // [{num: 7, mult: 500}]
        let studioAngle = 0;
        let studioSpinning = false;
        let studioBallAngle = -Math.PI / 2;
        let studioBallRadius = 242;

        function initStudio() {
            studioInitialized = true;
            drawStudioWheel(0, -Math.PI / 2, 242);

            // Render numbers
            const grid = document.getElementById('studioGrid');
            grid.innerHTML = '';
            for (let r = 3; r >= 1; r--) {
                for (let c = 0; c < 12; c++) {
                    const num = c * 3 + r;
                    const el = document.createElement('div');
                    el.className = `num-slot ${RED_NUMS.includes(num) ? 'red' : 'black'}`;
                    el.textContent = num;
                    el.id = `s-num-${num}`;
                    el.onclick = () => placeStudioBet(num);
                    grid.appendChild(el);
                }
            }

            refreshStudioMults();
            addStudioHistory(28, false);
            addStudioHistory(7, true);
            addStudioHistory(15, false);
            addStudioHistory(0, false);
        }

        function drawStudioWheel(wheelAngle, ballAngle = null, ballRadius = null) {
            const c = document.getElementById('studioWheelCanvas');
            if (!c) return;
            const ctx = c.getContext('2d');
            const w = c.width;
            const h = c.height;
            const r = w / 2; // 340
            const numSectors = 37;
            const slice = (Math.PI * 2) / numSectors;

            ctx.clearRect(0, 0, w, h);

            // 1. Outer Mahogany Bowl & Static Track
            ctx.save();
            ctx.translate(r, r);

            // Rich Mahogany Bowl
            const bowlGrad = ctx.createRadialGradient(0, 0, 260, 0, 0, r);
            bowlGrad.addColorStop(0, '#1c0c04');
            bowlGrad.addColorStop(0.5, '#351607');
            bowlGrad.addColorStop(0.85, '#1e0c03');
            bowlGrad.addColorStop(1, '#0c0501');
            ctx.beginPath();
            ctx.arc(0, 0, r - 2, 0, Math.PI * 2);
            ctx.fillStyle = bowlGrad;
            ctx.fill();

            // Outer Brass Inlay Rings
            ctx.beginPath();
            ctx.arc(0, 0, r - 6, 0, Math.PI * 2);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, r - 16, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Ball Track (Bronze / Dark Wood groove between 292 and 322)
            const trackGrad = ctx.createRadialGradient(0, 0, 292, 0, 0, 322);
            trackGrad.addColorStop(0, '#100702');
            trackGrad.addColorStop(0.5, '#241206');
            trackGrad.addColorStop(1, '#100702');
            ctx.beginPath();
            ctx.arc(0, 0, 307, 0, Math.PI * 2);
            ctx.strokeStyle = trackGrad;
            ctx.lineWidth = 28;
            ctx.stroke();

            // Brass Deflectors (8 Diamond Frets along ball track)
            for (let d = 0; d < 8; d++) {
                const da = d * (Math.PI / 4);
                const dx = Math.cos(da) * 307;
                const dy = Math.sin(da) * 307;

                ctx.save();
                ctx.translate(dx, dy);
                ctx.rotate(da);
                ctx.beginPath();
                ctx.moveTo(0, -9);
                ctx.lineTo(5, 0);
                ctx.lineTo(0, 9);
                ctx.lineTo(-5, 0);
                ctx.closePath();
                ctx.fillStyle = '#ffd700';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }

            ctx.restore();

            // 2. Rotating Wheel Rotor
            ctx.save();
            ctx.translate(r, r);
            ctx.rotate(wheelAngle);

            const rotorOuterRadius = 290;
            const pocketInnerRadius = 210;

            // Outer Brass Rotor Bezel
            const rotorBezelGrad = ctx.createRadialGradient(0, 0, 280, 0, 0, 292);
            rotorBezelGrad.addColorStop(0, '#d4af37');
            rotorBezelGrad.addColorStop(0.5, '#ffd700');
            rotorBezelGrad.addColorStop(1, '#855800');
            ctx.beginPath();
            ctx.arc(0, 0, rotorOuterRadius, 0, Math.PI * 2);
            ctx.fillStyle = rotorBezelGrad;
            ctx.fill();

            // Draw 37 Numbered Pockets
            for (let i = 0; i < numSectors; i++) {
                const num = ROULETTE_ORDER[i];
                const startA = i * slice;
                const endA = (i + 1) * slice;
                const midA = startA + (slice / 2);

                const isRed = RED_NUMS.includes(num);
                const isZero = (num === 0);

                // Pocket background fill
                ctx.beginPath();
                ctx.moveTo(Math.cos(startA) * pocketInnerRadius, Math.sin(startA) * pocketInnerRadius);
                ctx.arc(0, 0, rotorOuterRadius - 2, startA, endA);
                ctx.lineTo(Math.cos(endA) * pocketInnerRadius, Math.sin(endA) * pocketInnerRadius);
                ctx.arc(0, 0, pocketInnerRadius, endA, startA, true);
                ctx.closePath();

                if (isZero) {
                    ctx.fillStyle = '#008744'; // Emerald Green
                } else if (isRed) {
                    ctx.fillStyle = '#b91c1c'; // Ruby Red
                } else {
                    ctx.fillStyle = '#111827'; // Onyx Black
                }
                ctx.fill();

                // Highlight lucky multiplier numbers with a pulsing gold glow
                const lucky = currentMultipliers.find(m => m.num === num);
                if (lucky) {
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // Brass Frets / Dividers
                ctx.beginPath();
                ctx.moveTo(Math.cos(startA) * (pocketInnerRadius - 4), Math.sin(startA) * (pocketInnerRadius - 4));
                ctx.lineTo(Math.cos(startA) * rotorOuterRadius, Math.sin(startA) * rotorOuterRadius);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Pocket Ball Stop Ridge
                ctx.beginPath();
                ctx.arc(0, 0, 226, startA, endA);
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Number text facing tangentially - Ultra Bold and High Contrast
                ctx.save();
                ctx.rotate(midA);
                ctx.translate(252, 0);
                ctx.rotate(Math.PI / 2);
                ctx.fillStyle = '#ffffff';
                ctx.font = "900 24px 'JetBrains Mono', 'Inter', sans-serif";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 8;
                ctx.fillText(num.toString(), 0, 0);
                ctx.restore();
            }

            // Inner Slope Cone (Fluted Brass Cone leading to center turret)
            const coneInner = 75;
            const coneOuter = pocketInnerRadius;
            
            for (let i = 0; i < numSectors; i++) {
                const startA = i * slice;
                const endA = (i + 1) * slice;
                ctx.beginPath();
                ctx.moveTo(Math.cos(startA) * coneInner, Math.sin(startA) * coneInner);
                ctx.lineTo(Math.cos(startA) * coneOuter, Math.sin(startA) * coneOuter);
                ctx.lineTo(Math.cos(endA) * coneOuter, Math.sin(endA) * coneOuter);
                ctx.lineTo(Math.cos(endA) * coneInner, Math.sin(endA) * coneInner);
                ctx.closePath();
                ctx.fillStyle = (i % 2 === 0) ? '#a17215' : '#85590a';
                ctx.fill();
                ctx.strokeStyle = '#5a3c00';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }

            // Circular Brass Ribs on Cone
            ctx.beginPath();
            ctx.arc(0, 0, 140, 0, Math.PI * 2);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Center Turret Cone
            const turretRad = 74;
            const turretGrad = ctx.createRadialGradient(-12, -12, 4, 0, 0, turretRad);
            turretGrad.addColorStop(0, '#fffbe6');
            turretGrad.addColorStop(0.3, '#ffd700');
            turretGrad.addColorStop(0.65, '#b8860b');
            turretGrad.addColorStop(1, '#4a3000');

            ctx.beginPath();
            ctx.arc(0, 0, turretRad, 0, Math.PI * 2);
            ctx.fillStyle = turretGrad;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 4 Brass Spinner Arms (Turret Cross-Handles)
            for (let a = 0; a < 4; a++) {
                ctx.save();
                ctx.rotate(a * (Math.PI / 2));
                
                // Arm
                ctx.beginPath();
                ctx.moveTo(0, -turretRad + 8);
                ctx.lineTo(0, -turretRad - 26);
                ctx.lineWidth = 7;
                ctx.strokeStyle = '#ffd700';
                ctx.stroke();

                // Arm highlight
                ctx.beginPath();
                ctx.moveTo(-1, -turretRad + 8);
                ctx.lineTo(-1, -turretRad - 26);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Ball finial at end of arm
                const finialGrad = ctx.createRadialGradient(-3, -turretRad - 30, 1, 0, -turretRad - 28, 8);
                finialGrad.addColorStop(0, '#ffffff');
                finialGrad.addColorStop(0.4, '#ffd700');
                finialGrad.addColorStop(1, '#855800');
                ctx.beginPath();
                ctx.arc(0, -turretRad - 28, 8, 0, Math.PI * 2);
                ctx.fillStyle = finialGrad;
                ctx.fill();
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            }

            // Central Crown Gem / Spindle
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#b91c1c';
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-4, -4, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();

            ctx.restore();

            // 3. Ivory Roulette Ball (Drawn in global canvas space)
            if (ballRadius !== null && ballRadius > 20) {
                ctx.save();
                ctx.translate(r, r);

                const bx = Math.cos(ballAngle) * ballRadius;
                const by = Math.sin(ballAngle) * ballRadius;
                const ballR = 14;

                // Soft ball drop shadow
                ctx.beginPath();
                ctx.arc(bx + 3, by + 4, ballR, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fill();

                // Glowing White Halation / Motion Glow
                ctx.beginPath();
                ctx.arc(bx, by, ballR + 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();

                // 3D Ivory Sphere
                const ballGrad = ctx.createRadialGradient(bx - 4, by - 4, 1, bx, by, ballR);
                ballGrad.addColorStop(0, '#ffffff');
                ballGrad.addColorStop(0.35, '#ffffff');
                ballGrad.addColorStop(0.7, '#f1f5f9');
                ballGrad.addColorStop(0.9, '#cbd5e1');
                ballGrad.addColorStop(1, '#475569');

                ctx.beginPath();
                ctx.arc(bx, by, ballR, 0, Math.PI * 2);
                ctx.fillStyle = ballGrad;
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
            }

            // 4. Highlight Winning Pocket when ball settles under pin at 12 o'clock
            if (ballRadius !== null && ballRadius <= 245) {
                ctx.save();
                ctx.translate(r, r);
                ctx.beginPath();
                ctx.arc(0, 0, rotorOuterRadius + 1, -Math.PI / 2 - slice / 2, -Math.PI / 2 + slice / 2);
                ctx.arc(0, 0, pocketInnerRadius - 1, -Math.PI / 2 + slice / 2, -Math.PI / 2 - slice / 2, true);
                ctx.closePath();
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 215, 0, 0.28)';
                ctx.fill();
                ctx.restore();
            }
        }

        function refreshStudioMults() {
            const box = document.getElementById('studioMultGrid');
            box.innerHTML = '';
            
            // Randomly select 3-4 lucky numbers
            const pool = [...Array(37).keys()];
            pool.sort(() => 0.5 - Math.random());
            const chosen = pool.slice(0, 4);
            const multOptions = [50, 100, 150, 200, 250, 300, 500];

            currentMultipliers = chosen.map(n => ({
                num: n,
                mult: multOptions[Math.floor(Math.random() * multOptions.length)]
            }));

            currentMultipliers.forEach(m => {
                const color = m.num === 0 ? '#2ed573' : (RED_NUMS.includes(m.num) ? '#ff4757' : '#f1f2f6');
                box.innerHTML += `
                    <div class="mult-pill">
                        <span class="mult-num-text" style="color: ${color};">${m.num}</span>
                        <span class="mult-val-text">${m.mult}x</span>
                    </div>
                `;
            });
        }

        function pickChip(val, el) {
            studioChip = val;
            vaultSounds.chip.play();
            document.querySelectorAll('.chip-circle').forEach(c => c.classList.remove('selected'));
            if (el) el.classList.add('selected');
        }

        function updateTotalBetDisplay() {
            let total = 0;
            for (let k in studioBets) {
                total += studioBets[k];
            }
            const disp = `₨ ${total.toLocaleString()}`;
            const totalBetDisp = document.getElementById('totalBetDisp');
            if (totalBetDisp) totalBetDisp.textContent = disp;
            const tableHudBet = document.getElementById('tableHudBetVal');
            if (tableHudBet) tableHudBet.textContent = disp;
        }

        function placeStudioBet(num) {
            if (studioSpinning) return;
            
            // Validate wallet balance
            if (window.wallet) {
                if (!window.wallet.hasBalance(studioChip)) {
                    if (window.core && window.core.showToast) {
                        window.core.showToast('Insufficient wallet balance!', 'error');
                    } else {
                        alert('Insufficient wallet balance to place bet!');
                    }
                    return;
                }
                window.wallet.deductBet(studioChip, 'RouletteX VIP');
                syncWallet();
            }

            studioBets[num] = (studioBets[num] || 0) + studioChip;
            vaultSounds.chip.play();
            
            const slot = document.getElementById(`s-num-${num}`);
            if (slot) {
                slot.classList.add('has-chip');
                slot.setAttribute('data-val', studioBets[num]);
            }
            updateTotalBetDisplay();
        }

        function placeOutsideBet(betKey) {
            if (studioSpinning) return;
            
            if (window.wallet) {
                if (!window.wallet.hasBalance(studioChip)) {
                    if (window.core && window.core.showToast) {
                        window.core.showToast('Insufficient wallet balance!', 'error');
                    } else {
                        alert('Insufficient balance!');
                    }
                    return;
                }
                window.wallet.deductBet(studioChip, 'RouletteX VIP');
                syncWallet();
            }

            studioBets[betKey] = (studioBets[betKey] || 0) + studioChip;
            vaultSounds.chip.play();

            const keyMap = {
                '1st12': 's-num-1st12',
                '2nd12': 's-num-2nd12',
                '3rd12': 's-num-3rd12',
                '1-18': 's-num-low',
                'even': 's-num-even',
                'red': 's-num-red',
                'black': 's-num-black',
                'odd': 's-num-odd',
                '19-36': 's-num-high'
            };
            const slot = document.getElementById(keyMap[betKey]);
            if (slot) {
                slot.classList.add('has-chip');
                slot.setAttribute('data-val', studioBets[betKey]);
            }
            updateTotalBetDisplay();
        }

        function clearStudioBets() {
            if (studioSpinning) return;
            
            try {
                vaultSounds.spin.stop();
                vaultSounds.ball1.stop();
            } catch(e) {}

            const sv = document.getElementById('viewStudio');
            if (sv) sv.classList.remove('wheel-zoom-active');

            // Refund unspun bets
            let refund = 0;
            for (let k in studioBets) {
                refund += studioBets[k];
            }
            if (refund > 0 && window.wallet && typeof window.wallet.creditWin === 'function') {
                window.wallet.creditWin(refund, refund, 'RouletteX VIP', 1, 'Unspun bets cleared/refunded');
                syncWallet();
            }

            studioBets = {};
            document.querySelectorAll('.has-chip').forEach(el => {
                el.classList.remove('has-chip');
                el.removeAttribute('data-val');
            });
            updateTotalBetDisplay();
        }

        function spinStudioWheel() {
            if (studioSpinning) return;
            
            let totalPlaced = 0;
            for (let k in studioBets) totalPlaced += studioBets[k];
            if (totalPlaced === 0) {
                if (window.core && window.core.showToast) {
                    window.core.showToast('Please place a bet before spinning!', 'info');
                } else {
                    alert('Please place a bet on the board first!');
                }
                return;
            }

            // Cinematic Wheel Zoom Camera Focus
            const studioView = document.getElementById('viewStudio');
            if (studioView) studioView.classList.add('wheel-zoom-active');

            // Reset and cleanly start spin sound
            try {
                vaultSounds.spin.stop();
                vaultSounds.ball1.stop();
                vaultSounds.spin.volume(0.6);
                vaultSounds.spin.play();
            } catch(e) {}

            // Duck slow hip-hop BGM during spin
            try {
                if (rouletteBgmAudio && !rouletteBgmMuted && rouletteBgmAudio.playing()) {
                    rouletteBgmAudio.fade(0.35, 0.16, 400);
                }
            } catch(e) {}

            studioSpinning = true;
            refreshStudioMults();

            const winIdx = Math.floor(Math.random() * ROULETTE_ORDER.length);
            const winNum = ROULETTE_ORDER[winIdx];
            const slice = (Math.PI * 2) / 37;

            // Align winning pocket center directly under the top pin at 12 o'clock (-PI / 2)
            const targetSectorMid = winIdx * slice + (slice / 2);
            const baseRotations = Math.PI * 2 * 6; // 6 full clockwise rotations
            let delta = (-Math.PI / 2 - targetSectorMid - studioAngle) % (Math.PI * 2);
            if (delta < 0) delta += Math.PI * 2;
            const targetWheelAngle = studioAngle + baseRotations + delta;

            // Ball spins in opposite direction (counter-clockwise)
            const ballTurns = Math.PI * 2 * 9;
            const targetBallAngle = -Math.PI / 2; // Lands directly under top pin in winning pocket!
            const startBallAngle = targetBallAngle + ballTurns;

            let start = performance.now();
            const dur = 4600;
            let lastBallClick = 0;
            let spinSoundFading = false;

            function step(now) {
                const elapsed = now - start;
                const p = Math.min(elapsed / dur, 1);

                // Smoothly fade out the wheel spin sound as it decelerates
                if (p > 0.70 && !spinSoundFading) {
                    spinSoundFading = true;
                    try {
                        vaultSounds.spin.fade(0.6, 0, 1300);
                    } catch(e) {}
                }
                
                // Wheel rotation (easeOut cubic)
                const easeWheel = 1 - Math.pow(1 - p, 3);
                const currentWheelAngle = studioAngle + (targetWheelAngle - studioAngle) * easeWheel;

                // Ball rotation (easeOut 2.5)
                const easeBall = 1 - Math.pow(1 - p, 2.5);
                studioBallAngle = startBallAngle - (ballTurns * easeBall);

                // Ball radial distance: starts on outer track (r=307), drops into pocket (r=242)
                if (p < 0.62) {
                    studioBallRadius = 307; // Outer track
                } else if (p < 0.88) {
                    const dropP = (p - 0.62) / 0.26;
                    studioBallRadius = 307 - (dropP * 65); // 307 down to 242
                    if (now - lastBallClick > 130) {
                        lastBallClick = now;
                        vaultSounds.ball1.play();
                    }
                } else {
                    const bounceP = (p - 0.88) / 0.12;
                    const bounce = Math.sin(bounceP * Math.PI * 2) * (1 - bounceP) * 5;
                    studioBallRadius = 242 + bounce;
                }

                drawStudioWheel(currentWheelAngle, studioBallAngle, studioBallRadius);

                if (p < 1) {
                    requestAnimationFrame(step);
                } else {
                    studioAngle = targetWheelAngle % (Math.PI * 2);
                    studioBallAngle = -Math.PI / 2;
                    studioBallRadius = 242;
                    studioSpinning = false;

                    // Hard stop all spin and ball sound effects immediately
                    try {
                        vaultSounds.spin.stop();
                        vaultSounds.ball1.stop();
                    } catch(e) {}

                    // Restore slow hip-hop BGM volume
                    try {
                        if (rouletteBgmAudio && !rouletteBgmMuted && rouletteBgmAudio.playing()) {
                            rouletteBgmAudio.fade(0.16, 0.35, 800);
                        }
                    } catch(e) {}

                    drawStudioWheel(studioAngle, studioBallAngle, studioBallRadius);
                    resolveSpinPayout(winNum);
                }
            }
            requestAnimationFrame(step);
        }

        function resolveSpinPayout(winNum) {
            const isRed = RED_NUMS.includes(winNum);
            addStudioHistory(winNum, isRed);

            let totalPayout = 0;
            let luckyMultiplierHit = null;

            // 1. Straight Up Bets
            if (studioBets[winNum]) {
                const bet = studioBets[winNum];
                const lucky = currentMultipliers.find(m => m.num === winNum);
                if (lucky) {
                    luckyMultiplierHit = lucky.mult;
                    totalPayout += bet * lucky.mult;
                } else {
                    totalPayout += bet * 36;
                }
            }

            // 2. Outside Bets (0 loses all outside bets in European Roulette)
            if (winNum !== 0) {
                if (studioBets['red'] && isRed) totalPayout += studioBets['red'] * 2;
                if (studioBets['black'] && !isRed) totalPayout += studioBets['black'] * 2;
                if (studioBets['even'] && winNum % 2 === 0) totalPayout += studioBets['even'] * 2;
                if (studioBets['odd'] && winNum % 2 === 1) totalPayout += studioBets['odd'] * 2;
                if (studioBets['1-18'] && winNum >= 1 && winNum <= 18) totalPayout += studioBets['1-18'] * 2;
                if (studioBets['19-36'] && winNum >= 19 && winNum <= 36) totalPayout += studioBets['19-36'] * 2;
                if (studioBets['1st12'] && winNum >= 1 && winNum <= 12) totalPayout += studioBets['1st12'] * 3;
                if (studioBets['2nd12'] && winNum >= 13 && winNum <= 24) totalPayout += studioBets['2nd12'] * 3;
                if (studioBets['3rd12'] && winNum >= 25 && winNum <= 36) totalPayout += studioBets['3rd12'] * 3;
            }

            let totalPlaced = 0;
            for (let k in studioBets) totalPlaced += studioBets[k];

            if (totalPayout > 0) {
                vaultSounds.win.play();
                if (window.wallet && typeof window.wallet.creditWin === 'function') {
                    const multRatio = (totalPayout / totalPlaced).toFixed(1);
                    window.wallet.creditWin(totalPlaced, totalPayout, 'RouletteX VIP', multRatio, `Pocket #${winNum}${luckyMultiplierHit ? ' (' + luckyMultiplierHit + 'x)' : ''}`);
                    syncWallet();
                }

                const winEl = document.getElementById('tableHudWinVal');
                if (winEl) winEl.textContent = `+₨ ${totalPayout.toLocaleString()}`;

                if (luckyMultiplierHit) {
                    showWinToast(`⚡ 500X LUCKY HIT! WIN ₨ ${totalPayout.toLocaleString()}`);
                } else {
                    showWinToast(`🎉 POCKET #${winNum}! YOU WON ₨ ${totalPayout.toLocaleString()}`);
                }
            } else {
                const winEl = document.getElementById('tableHudWinVal');
                if (winEl) winEl.textContent = `₨ 0`;
                showWinToast(`POCKET #${winNum} (${winNum === 0 ? 'GREEN 0' : (isRed ? 'RED' : 'BLACK')})`);
            }

            // Clear chips for next round
            studioBets = {};
            document.querySelectorAll('.has-chip').forEach(el => {
                el.classList.remove('has-chip');
                el.removeAttribute('data-val');
            });
            updateTotalBetDisplay();

            // Smoothly pan camera back to betting table after showcasing winning pocket
            setTimeout(() => {
                const sv = document.getElementById('viewStudio');
                if (sv) sv.classList.remove('wheel-zoom-active');
            }, 2300);
        }

        function addStudioHistory(num, isRed) {
            const h = document.getElementById('studioHistory');
            const color = num === 0 ? '#00b894' : (isRed ? '#d63031' : '#2d3436');
            h.innerHTML = `<span style="background: ${color}; color: #fff; font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 50%; min-width: 22px; text-align: center;">${num}</span>` + h.innerHTML;
        }

        /* --- Animated VIP Casino Background Engine --- */
        function initCasinoBackground() {
            const canvas = document.getElementById('casinoBgCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w = 0, h = 0;

            function resize() {
                const parent = canvas.parentElement;
                w = canvas.width = parent ? parent.clientWidth : window.innerWidth;
                h = canvas.height = parent ? parent.clientHeight : window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // 1. Shimmering Gold & Azure Casino Dust Motes
            const dustCount = 42;
            const dust = [];
            for (let i = 0; i < dustCount; i++) {
                dust.push({
                    x: Math.random() * (w || 800),
                    y: Math.random() * (h || 600),
                    r: Math.random() * 2.2 + 0.8,
                    speedY: Math.random() * 0.45 + 0.2,
                    angle: Math.random() * Math.PI * 2,
                    speedAngle: Math.random() * 0.025 + 0.01,
                    alpha: Math.random() * 0.6 + 0.2,
                    gold: Math.random() > 0.35
                });
            }

            // 2. Floating Casino Suit Glyphs (♠, ♥, ♦, ♣, ★, 7)
            const symbols = ['♠', '♥', '♦', '♣', '★', '7'];
            const glyphCount = 14;
            const glyphs = [];
            for (let i = 0; i < glyphCount; i++) {
                glyphs.push({
                    char: symbols[Math.floor(Math.random() * symbols.length)],
                    x: Math.random() * (w || 800),
                    y: Math.random() * (h || 600),
                    size: Math.random() * 14 + 13,
                    speedY: Math.random() * 0.35 + 0.15,
                    speedX: (Math.random() - 0.5) * 0.3,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.012,
                    alpha: Math.random() * 0.22 + 0.08,
                    color: Math.random() > 0.45 ? '#ffd700' : (Math.random() > 0.5 ? '#ff4757' : '#2ed573')
                });
            }

            // 3. Twinkling Diamond Star Sparkles
            const sparkles = [];
            for (let i = 0; i < 7; i++) {
                sparkles.push({
                    x: Math.random() * (w || 800),
                    y: Math.random() * (h || 600),
                    size: Math.random() * 9 + 6,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.035 + 0.015
                });
            }

            function drawSparkle(x, y, size, alpha) {
                if (alpha <= 0.02) return;
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = `rgba(255, 235, 170, ${alpha})`;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(0, -size);
                ctx.quadraticCurveTo(0, 0, size, 0);
                ctx.quadraticCurveTo(0, 0, 0, size);
                ctx.quadraticCurveTo(0, 0, -size, 0);
                ctx.quadraticCurveTo(0, 0, 0, -size);
                ctx.fill();
                ctx.restore();
            }

            function render() {
                if (document.hidden) {
                    requestAnimationFrame(render);
                    return;
                }

                ctx.clearRect(0, 0, w, h);

                // Draw Dust Motes
                for (let i = 0; i < dust.length; i++) {
                    const p = dust[i];
                    p.y -= p.speedY;
                    p.angle += p.speedAngle;
                    p.x += Math.sin(p.angle) * 0.35;
                    if (p.y < -10) {
                        p.y = h + 10;
                        p.x = Math.random() * w;
                    }

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = p.gold ? 
                        `rgba(255, 215, 0, ${p.alpha})` : 
                        `rgba(130, 200, 255, ${p.alpha * 0.8})`;
                    ctx.shadowBlur = p.r * 3;
                    ctx.shadowColor = p.gold ? '#ffd700' : '#00b4d8';
                    ctx.fill();
                    ctx.restore();
                }

                // Draw Floating Casino Symbols
                for (let i = 0; i < glyphs.length; i++) {
                    const g = glyphs[i];
                    g.y -= g.speedY;
                    g.x += g.speedX;
                    g.rotation += g.rotSpeed;
                    if (g.y < -30) {
                        g.y = h + 30;
                        g.x = Math.random() * w;
                        g.char = symbols[Math.floor(Math.random() * symbols.length)];
                    }

                    ctx.save();
                    ctx.translate(g.x, g.y);
                    ctx.rotate(g.rotation);
                    ctx.font = `bold ${g.size}px 'Segoe UI Symbol', 'Apple Color Emoji', sans-serif`;
                    ctx.fillStyle = g.color;
                    ctx.globalAlpha = g.alpha;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = g.color;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(g.char, 0, 0);
                    ctx.restore();
                }

                // Draw Twinkling Sparkles
                for (let i = 0; i < sparkles.length; i++) {
                    const s = sparkles[i];
                    s.phase += s.speed;
                    const a = (Math.sin(s.phase) + 1) / 2;
                    if (a > 0.05) {
                        drawSparkle(s.x, s.y, s.size * a, a * 0.65);
                    }
                    if (s.phase > Math.PI * 2 * 10) {
                        s.phase = 0;
                        s.x = Math.random() * w;
                        s.y = Math.random() * h;
                    }
                }

                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }

        /* --- Pragmatic Play Official VIP Loading Screen Engine --- */
        (function initPPLoader() {
            const ppScreen = document.getElementById('pp-loading-screen');
            const ppBar = document.getElementById('pp-bar-fill');
            if (!ppScreen || !ppBar) return;

            // Early audio permission grabber on any touch/pointer during loading
            const unlockEarlyAudio = () => {
                try {
                    if (rouletteBgmAudio) {
                        rouletteBgmAudio.mute(false);
                        if (!rouletteBgmAudio.playing()) rouletteBgmAudio.play();
                    }
                    if (typeof Howler !== 'undefined' && Howler.ctx && Howler.ctx.state === 'suspended') {
                        Howler.ctx.resume();
                    }
                } catch(e) {}
            };
            window.addEventListener('pointerdown', unlockEarlyAudio, { capture: true, passive: true, once: true });
            window.addEventListener('touchstart', unlockEarlyAudio, { capture: true, passive: true, once: true });
            window.addEventListener('mousedown', unlockEarlyAudio, { capture: true, passive: true, once: true });
            window.addEventListener('mousemove', unlockEarlyAudio, { capture: true, passive: true, once: true });

            let pct = 0;
            let finished = false;

            function finishLoading() {
                if (finished) return;
                finished = true;
                ppBar.style.width = '100%';

                // Automatically start music as loading completes
                if (typeof startBGMAuto === 'function') {
                    startBGMAuto();
                }

                setTimeout(() => {
                    ppScreen.classList.add('pp-fade-out');
                    if (typeof startBGMAuto === 'function') {
                        startBGMAuto();
                    }
                    setTimeout(() => {
                        if (ppScreen.parentNode) ppScreen.parentNode.removeChild(ppScreen);
                    }, 550);
                }, 250);
            }

            const stepLoading = () => {
                if (finished) return;
                if (pct < 35) {
                    pct += Math.floor(Math.random() * 8) + 14;
                } else if (pct < 70) {
                    pct += Math.floor(Math.random() * 10) + 12;
                } else if (pct < 95) {
                    pct += Math.floor(Math.random() * 8) + 8;
                } else {
                    pct = 100;
                }

                ppBar.style.width = Math.min(pct, 100) + '%';

                if (pct >= 100) {
                    finishLoading();
                } else {
                    setTimeout(stepLoading, Math.floor(Math.random() * 80) + 60);
                }
            };

            setTimeout(stepLoading, 100);

            // Failsafe max timeout
            setTimeout(finishLoading, 2400);
        })();

        /* --- Slow Hip-Hop Casino Lounge Background Music Engine --- */
        let rouletteBgmAudio = null;
        let rouletteBgmMuted = false;

        function initRouletteBGM() {
            try {
                rouletteBgmMuted = localStorage.getItem('roulette_bgm_muted') === '1';
                rouletteBgmAudio = new Howl({
                    src: ['../game_assets/audio_sounds/roulette_hiphop.wav', '../assets/audio/roulette_hiphop.wav'],
                    loop: true,
                    volume: rouletteBgmMuted ? 0.0 : 0.35,
                    autoplay: false,
                    html5: false,
                    onload: () => {
                        startBGMAuto();
                    }
                });

                startBGMAuto();
                updateBGMButtonState();
            } catch (e) {
                console.warn('Roulette BGM init error', e);
            }
        }

        function startBGMAuto() {
            if (!rouletteBgmAudio || rouletteBgmMuted) return;
            try {
                if (typeof Howler !== 'undefined' && Howler.ctx && Howler.ctx.state === 'suspended') {
                    Howler.ctx.resume().catch(() => {});
                }

                rouletteBgmAudio.volume(0.35);
                const playPromise = rouletteBgmAudio.play();
                if (playPromise !== undefined && playPromise && typeof playPromise.then === 'function') {
                    playPromise.then(() => {
                        rouletteBgmMuted = false;
                        updateBGMButtonState();
                    }).catch(err => {
                        // Play muted first so audio stream starts decoding
                        rouletteBgmAudio.mute(true);
                        rouletteBgmAudio.play();

                        // Unmute immediately on any user gesture or mouse motion
                        const autoUnmute = () => {
                            try {
                                if (typeof Howler !== 'undefined' && Howler.ctx && Howler.ctx.state === 'suspended') {
                                    Howler.ctx.resume();
                                }
                                rouletteBgmAudio.mute(false);
                                rouletteBgmAudio.fade(0, 0.35, 300);
                                rouletteBgmMuted = false;
                                updateBGMButtonState();
                            } catch(e) {}
                            window.removeEventListener('pointerdown', autoUnmute, true);
                            window.removeEventListener('touchstart', autoUnmute, true);
                            window.removeEventListener('click', autoUnmute, true);
                            window.removeEventListener('mousemove', autoUnmute, true);
                            window.removeEventListener('scroll', autoUnmute, true);
                            window.removeEventListener('keydown', autoUnmute, true);
                        };
                        window.addEventListener('pointerdown', autoUnmute, { capture: true, passive: true });
                        window.addEventListener('touchstart', autoUnmute, { capture: true, passive: true });
                        window.addEventListener('click', autoUnmute, { capture: true, passive: true });
                        window.addEventListener('mousemove', autoUnmute, { capture: true, passive: true });
                        window.addEventListener('scroll', autoUnmute, { capture: true, passive: true });
                        window.addEventListener('keydown', autoUnmute, { capture: true, passive: true });
                    });
                }
            } catch(e) {}
        }

        function toggleRouletteBGM() {
            if (!rouletteBgmAudio) return;
            rouletteBgmMuted = !rouletteBgmMuted;
            try {
                localStorage.setItem('roulette_bgm_muted', rouletteBgmMuted ? '1' : '0');
            } catch (e) {}

            if (rouletteBgmMuted) {
                rouletteBgmAudio.fade(rouletteBgmAudio.volume(), 0.0, 300);
                setTimeout(() => rouletteBgmAudio.pause(), 350);
            } else {
                rouletteBgmAudio.volume(0.35);
                rouletteBgmAudio.play();
            }
            updateBGMButtonState();
        }

        function updateBGMButtonState() {
            const btn = document.getElementById('btnAudioToggle');
            if (btn) {
                btn.textContent = rouletteBgmMuted ? '🔇' : '🎵';
                btn.style.opacity = rouletteBgmMuted ? '0.5' : '1.0';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initRouletteBGM();
            initCasinoBackground();
            initStudio();
            syncWallet();
            fetchServerBalance();
            if (window.wallet && window.wallet.on) {
                window.wallet.on('balanceChange', () => syncWallet());
                window.wallet.on('change', () => syncWallet());
            }
            window.addEventListener('storage', () => syncWallet());
            setInterval(fetchServerBalance, 5000);
        });
