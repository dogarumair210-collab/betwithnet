<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortune Gems 2 - All Templates & Themes Master Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #ffd700;
            --brand-cyan: #00a3e0;
            --bg-dark: #040810;
            --panel-bg: #0b1524;
            --border-line: #1c324e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Master Control Bar (Always visible at the top) */
        .master-nav-header {
            background: linear-gradient(180deg, #0d1b30 0%, #08111f 100%);
            border-bottom: 2px solid var(--brand-gold);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }

        .master-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .master-logo-text {
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff7b8, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .master-badge {
            background: var(--brand-cyan);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Template Switcher Tabs */
        .template-tabs-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #94a3b8;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, #ffd700, #b8860b);
            color: #000;
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
        }

        .master-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download-main {
            background: linear-gradient(180deg, #10b981, #059669);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-download-main:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        /* Viewport Stage */
        .stage-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 66px);
            position: relative;
            background: #02050a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .template-view-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Mobile Viewport Simulation Mode */
        .mobile-device-wrapper {
            display: none;
            width: 390px;
            height: 780px;
            background: #111;
            border: 12px solid #2d3748;
            border-radius: 46px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 40px rgba(255, 215, 0, 0.25);
            position: relative;
            overflow: hidden;
        }

        .mobile-device-wrapper::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 22px;
            background: #000;
            border-radius: 12px;
            z-index: 100;
        }

        .mobile-device-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Master Header Switcher Bar -->
    <header class="master-nav-header">
        <div class="master-logo">
            <span style="font-size: 20px;">💎</span>
            <span class="master-logo-text">Fortune Gems 2</span>
            <span class="master-badge">All Templates Demo</span>
        </div>

        <!-- 5 Template Switcher Tabs -->
        <nav class="template-tabs-group">
            <button class="tab-btn active" onclick="loadTemplate('portal', this)">
                <span>🏛️</span> 1xBet Portal Template
            </button>
            <button class="tab-btn" onclick="loadTemplate('standalone', this)">
                <span>🎮</span> Standalone Slot Machine
            </button>
            <button class="tab-btn" onclick="loadTemplate('mobile', this)">
                <span>📱</span> Mobile App Simulator
            </button>
            <button class="tab-btn" onclick="loadTemplate('assets', this)">
                <span>🎨</span> Graphics & Themes Gallery
            </button>
        </nav>

        <div class="master-actions">
            <a href="fortune_gems_2_template.zip" download class="btn-download-main">
                <span>📦</span> Download All Templates (.ZIP)
            </a>
            <a href="../casino.html" class="tab-btn" style="border: 1px solid var(--border-line);">
                <span>🏠</span> Casino Hall
            </a>
        </div>
    </header>

    <!-- Main Viewport Stage -->
    <main class="stage-container" id="stageContainer">
        <!-- Default Fullscreen View -->
        <iframe id="mainFrame" class="template-view-frame" src="1xbet_portal_embed/index.html" title="Active Template View"></iframe>

        <!-- Mobile Phone Simulator Container -->
        <div class="mobile-device-wrapper" id="mobileWrapper">
            <iframe id="mobileFrame" src="standalone_game/index.html" title="Mobile Template View"></iframe>
        </div>
    </main>

    <script>
        const frame = document.getElementById('mainFrame');
        const mobileWrapper = document.getElementById('mobileWrapper');

        function loadTemplate(type, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (type === 'mobile') {
                frame.style.display = 'none';
                mobileWrapper.style.display = 'block';
                document.getElementById('mobileFrame').src = 'standalone_game/index.html';
            } else {
                mobileWrapper.style.display = 'none';
                frame.style.display = 'block';

                if (type === 'portal') {
                    frame.src = '1xbet_portal_embed/index.html';
                } else if (type === 'standalone') {
                    frame.src = 'standalone_game/index.html';
                } else if (type === 'assets') {
                    frame.src = '../fortune_gems_2_extracted_assets/index.html';
                }
            }
        }
    </script>

</body>
</html>
