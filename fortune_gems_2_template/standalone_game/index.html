<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fortune Gems 2 - Standalone Game & Multi-Theme Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Theme 1: Aztec Gold (Default) */
            --theme-bg-img: url('assets/backgrounds_and_covers/fortunegems_bg.jpg');
            --primary-accent: #ffd700;
            --primary-highlight: #fff5a6;
            --cabinet-border: #b8860b;
            --cabinet-shadow: rgba(255, 215, 0, 0.35);
            --cabinet-glow: #ffd700;
            --slot-bg: rgba(6, 12, 22, 0.95);
            --reel-width: 125px;
            --reel-height: 110px;
        }

        /* Theme 2: Crimson Ruby Temple */
        body.theme-ruby {
            --primary-accent: #ff1744;
            --primary-highlight: #ff8a80;
            --cabinet-border: #b71c1c;
            --cabinet-shadow: rgba(255, 23, 68, 0.4);
            --cabinet-glow: #ff1744;
            --slot-bg: rgba(20, 6, 10, 0.95);
        }

        /* Theme 3: Sapphire Casino Neon */
        body.theme-sapphire {
            --primary-accent: #00b0ff;
            --primary-highlight: #80d8ff;
            --cabinet-border: #0277bd;
            --cabinet-shadow: rgba(0, 176, 255, 0.4);
            --cabinet-glow: #00b0ff;
            --slot-bg: rgba(5, 15, 30, 0.95);
        }

        /* Theme 4: Emerald Jungle Mayan */
        body.theme-emerald {
            --primary-accent: #00e676;
            --primary-highlight: #b9f6ca;
            --cabinet-border: #2e7d32;
            --cabinet-shadow: rgba(0, 230, 118, 0.4);
            --cabinet-glow: #00e676;
            --slot-bg: rgba(6, 20, 12, 0.95);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: #03060c;
            background-image: radial-gradient(circle at 50% 10%, rgba(255, 215, 0, 0.12) 0%, transparent 70%), var(--theme-bg-img);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 10px 40px 10px;
            overflow-x: hidden;
            transition: background 0.4s ease;
        }

        /* Top Theme & Download Toolbar */
        .top-demo-toolbar {
            width: 100%;
            max-width: 920px;
            background: rgba(10, 18, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            z-index: 50;
        }

        .theme-selector-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-btn {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .theme-btn.active {
            background: var(--primary-accent);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px var(--cabinet-shadow);
        }

        .download-btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-chip {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .chip-download {
            background: linear-gradient(180deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
            border: none;
        }

        .chip-assets {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
        }

        /* Standalone Slot Machine Container */
        .game-viewport {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Aztec Slot Cabinet */
        .aztec-cabinet {
            position: relative;
            background: var(--slot-bg);
            border: 4px solid var(--cabinet-border);
            border-radius: 24px;
            padding: 16px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 
                        0 0 40px var(--cabinet-shadow),
                        inset 0 0 25px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            backdrop-filter: blur(6px);
            transition: all 0.4s ease;
        }

        .cabinet-top-crest {
            position: absolute;
            top: -20px;
            background: linear-gradient(180deg, var(--primary-highlight) 0%, var(--primary-accent) 50%, var(--cabinet-border) 100%);
            border: 2px solid #fff5a6;
            border-radius: 20px;
            padding: 4px 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 15px var(--cabinet-shadow);
            z-index: 10;
        }

        .cabinet-top-crest span {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 900;
            color: #1a1001;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Reels Stage */
        .reels-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            background: #020408;
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 8px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
            overflow: hidden;
            width: 100%;
        }

        .cabinet-pillar {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 94%;
            background-image: url('assets/cabinet_and_ui/aztec_pillar.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            opacity: 0.85;
            z-index: 8;
        }
        .cabinet-pillar.left { left: 4px; }
        .cabinet-pillar.right { right: 4px; transform: translateY(-50%) scaleX(-1); }

        /* Reel Column */
        .reel-column {
            width: var(--reel-width);
            height: calc(var(--reel-height) * 3);
            overflow: hidden;
            position: relative;
            background: rgba(10, 18, 30, 0.85);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .reel-column.special-reel {
            background: rgba(28, 16, 4, 0.9);
            border: 1.5px solid var(--primary-accent);
            box-shadow: 0 0 15px var(--cabinet-shadow);
        }

        .reel-separator {
            width: 4px;
            height: calc(var(--reel-height) * 3);
            background: linear-gradient(180deg, var(--primary-accent) 0%, #1e1302 50%, var(--primary-accent) 100%);
            border-radius: 2px;
        }

        .reel-tape {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .symbol-cell {
            width: var(--reel-width);
            height: var(--reel-height);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 6px;
        }

        .symbol-cell img {
            max-width: 86%;
            max-height: 86%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
            transition: transform 0.2s ease;
        }

        .symbol-cell.win-hit img {
            animation: pulseWinSymbol 0.5s infinite alternate ease-in-out;
        }

        @keyframes pulseWinSymbol {
            0% { transform: scale(1); filter: drop-shadow(0 0 8px var(--primary-accent)) brightness(1); }
            100% { transform: scale(1.18); filter: drop-shadow(0 0 20px var(--primary-accent)) brightness(1.35); }
        }

        /* 4th Reel Center Golden Frame */
        .special-center-frame {
            position: absolute;
            top: var(--reel-height);
            left: 0;
            width: 100%;
            height: var(--reel-height);
            border: 2px solid var(--primary-accent);
            border-radius: 8px;
            box-shadow: inset 0 0 15px var(--cabinet-shadow), 0 0 20px var(--cabinet-shadow);
            pointer-events: none;
            z-index: 6;
            animation: pulseFrame 1.4s infinite alternate;
        }

        @keyframes pulseFrame {
            0% { border-color: var(--cabinet-border); }
            100% { border-color: var(--primary-highlight); }
        }

        /* Payline Canvas Overlay */
        #laserCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* Payout Ribbon */
        .payout-ribbon {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            padding: 10px 18px;
            background: #08111d;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
        }

        .ribbon-item {
            display: flex;
            flex-direction: column;
        }

        .ribbon-label {
            font-size: 10px;
            color: #8da4be;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .ribbon-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 19px;
            font-weight: 900;
            color: var(--primary-accent);
        }

        .ribbon-val.win-val {
            color: #00e676;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
        }

        /* Controls Deck */
        .controls-dashboard {
            width: 100%;
            margin-top: 14px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls-right {
            justify-content: flex-end;
        }

        .bet-box {
            display: flex;
            align-items: center;
            background: #0a1628;
            border: 1.5px solid #203a5e;
            border-radius: 12px;
            padding: 4px;
            gap: 6px;
        }

        .bet-step-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #142845;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--primary-accent);
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .bet-step-btn:hover {
            background: #1f3d6b;
            border-color: var(--primary-accent);
        }

        .bet-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            min-width: 60px;
            text-align: center;
        }

        .toggle-btn {
            padding: 8px 14px;
            border-radius: 10px;
            background: #0e1b2e;
            border: 1px solid #1f3657;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-btn.active {
            background: linear-gradient(180deg, #f59e0b, #d97706);
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
        }

        .toggle-btn.extra-bet.active {
            background: linear-gradient(180deg, #ff1744, #c2185b);
            color: #fff;
            box-shadow: 0 0 14px rgba(255, 23, 68, 0.6);
        }

        /* Center Spin Button */
        .spin-btn-wrap {
            display: flex;
            justify-content: center;
        }

        .spin-btn {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background-image: url('assets/cabinet_and_ui/aztec_spin_button.png');
            background-size: cover;
            background-position: center;
            border: 3px solid var(--primary-accent);
            box-shadow: 0 8px 24px rgba(0,0,0,0.8), 0 0 25px var(--cabinet-shadow);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.2s;
            outline: none;
        }

        .spin-btn:hover {
            transform: scale(1.06);
            filter: brightness(1.15);
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .spin-btn.spinning {
            animation: rotateSpinBtn 1s linear infinite;
            pointer-events: none;
            filter: brightness(0.9);
        }

        @keyframes rotateSpinBtn {
            100% { transform: rotate(360deg); }
        }

        /* Lucky Wheel Modal */
        .wheel-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
        }

        .wheel-modal.show { display: flex; }

        .wheel-container {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-disc-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.1s linear;
            filter: drop-shadow(0 0 35px var(--cabinet-shadow));
        }

        .wheel-pointer-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
        }

        .wheel-btn-spin {
            margin-top: 24px;
            padding: 12px 36px;
            border-radius: 24px;
            background: linear-gradient(180deg, var(--primary-accent), var(--cabinet-border));
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 16px;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 20px var(--cabinet-shadow);
            transition: all 0.2s;
        }

        /* Big Win Modal */
        .bigwin-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 120;
            backdrop-filter: blur(8px);
        }

        .bigwin-modal.show { display: flex; }

        .bigwin-shield-img {
            max-width: 320px;
            filter: drop-shadow(0 0 40px var(--cabinet-shadow));
            animation: floatShield 2s infinite ease-in-out alternate;
        }

        @keyframes floatShield {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-12px) scale(1.05); }
        }

        .bigwin-amount {
            font-family: 'Cinzel', serif;
            font-size: 42px;
            font-weight: 900;
            color: var(--primary-accent);
            text-shadow: 0 0 30px var(--cabinet-shadow);
            margin-top: 10px;
        }

        /* 3D Coin Rain Canvas */
        #coinRainCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 110;
        }

        /* Responsive */
        @media (max-width: 768px) {
            :root {
                --reel-width: 78px;
                --reel-height: 75px;
            }
            .spin-btn { width: 70px; height: 70px; }
            .wheel-container { width: 290px; height: 290px; }
            .controls-dashboard { grid-template-columns: 1fr; gap: 8px; }
            .controls-left, .controls-right { justify-content: center; }
        }
    </style>
</head>

    /* -------------------------------------------------------------
       1. GAME STATE & SYMBOLS DATA
       ------------------------------------------------------------- */
    const SYMBOLS = {
        WILD:     { id: 'WILD',     payout: 25, src: 'assets/symbols/sym_wild.png' },
        RUBY:     { id: 'RUBY',     payout: 20, src: 'assets/symbols/sym_ruby.png' },
        SAPPHIRE: { id: 'SAPPHIRE', payout: 15, src: 'assets/symbols/sym_sapphire.png' },
        EMERALD:  { id: 'EMERALD',  payout: 10, src: 'assets/symbols/sym_emerald.png' },
        A:        { id: 'A',        payout: 5,  src: 'assets/symbols/sym_a.png' },
        K:        { id: 'K',        payout: 4,  src: 'assets/symbols/sym_k.png' },
        Q:        { id: 'Q',        payout: 3,  src: 'assets/symbols/sym_q.png' },
        J:        { id: 'J',        payout: 2,  src: 'assets/symbols/sym_j.png' }
    };

    const MAIN_KEYS = ['WILD', 'RUBY', 'RUBY', 'SAPPHIRE', 'SAPPHIRE', 'EMERALD', 'EMERALD', 'A', 'A', 'K', 'K', 'Q', 'J'];

    const MULTIPLIERS = [
        { id: '1X', mult: 1, src: 'assets/multipliers_svg/multiplier_1x.svg' },
        { id: '2X', mult: 2, src: 'assets/multipliers_svg/multiplier_2x.svg' },
        { id: '3X', mult: 3, src: 'assets/multipliers_svg/multiplier_3x.svg' },
        { id: '5X', mult: 5, src: 'assets/multipliers_svg/multiplier_5x.svg' },
        { id: '10X', mult: 10, src: 'assets/multipliers_svg/multiplier_10x.svg' },
        { id: '15X', mult: 15, src: 'assets/multipliers_svg/multiplier_15x.svg' },
        { id: 'WHEEL', isWheel: true, src: 'assets/symbols/sym_wheel.png' }
    ];

    const PAYLINES = [
        { id: 1, coords: [[1,0], [1,1], [1,2]], color: '#ffd700' },
        { id: 2, coords: [[0,0], [0,1], [0,2]], color: '#00b0ff' },
        { id: 3, coords: [[2,0], [2,1], [2,2]], color: '#ff1744' },
        { id: 4, coords: [[0,0], [1,1], [2,2]], color: '#00e676' },
        { id: 5, coords: [[2,0], [1,1], [0,2]], color: '#d500f9' }
    ];

    let balance = 50000;
    let baseBet = 50;
    let isExtraBet = false;
    let isTurbo = false;
    let isAuto = false;
    let autoCount = 0;
    let isSpinning = false;

    let currentGrid = [
        ['RUBY', 'WILD', 'SAPPHIRE'],
        ['A', 'K', 'EMERALD'],
        ['Q', 'J', 'RUBY']
    ];
    let currentSpecial = MULTIPLIERS[0];

    const audio = new SlotAudioEngine();

    /* -------------------------------------------------------------
       2. THEME SWITCHER
       ------------------------------------------------------------- */
    function switchTheme(themeName, btn) {
        document.body.className = `theme-${themeName}`;
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const titles = {
            aztec: 'TaDa Gaming • Aztec Gold',
            ruby: 'Fortune Gems • Ruby Temple',
            sapphire: 'Fortune Gems • Sapphire Neon',
            emerald: 'Fortune Gems • Emerald Mayan'
        };
        document.getElementById('crestTitle').innerText = titles[themeName] || 'Fortune Gems 2';
    }

    /* -------------------------------------------------------------
       3. 3D GOLD COIN RAIN ENGINE
       ------------------------------------------------------------- */
    const coinCanvas = document.getElementById('coinRainCanvas');
    const cCtx = coinCanvas.getContext('2d');
    let cW = coinCanvas.width = window.innerWidth;
    let cH = coinCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        cW = coinCanvas.width = window.innerWidth;
        cH = coinCanvas.height = window.innerHeight;
    });

    const coins = [];
    function emitCoins(count = 60) {
        for (let i = 0; i < count; i++) {
            coins.push({
                x: Math.random() * cW,
                y: -30 - Math.random() * 200,
                size: 14 + Math.random() * 12,
                vy: 5 + Math.random() * 7,
                vx: (Math.random() - 0.5) * 3,
                rot: Math.random() * Math.PI * 2,
                vrot: (Math.random() - 0.5) * 0.25
            });
        }
    }

    function coinRainLoop() {
        cCtx.clearRect(0, 0, cW, cH);
        for (let i = coins.length - 1; i >= 0; i--) {
            const c = coins[i];
            c.y += c.vy;
            c.x += c.vx;
            c.rot += c.vrot;
            const sy = Math.cos(c.rot);

            cCtx.save();
            cCtx.translate(c.x, c.y);
            cCtx.scale(1, Math.abs(sy));
            cCtx.beginPath();
            cCtx.arc(0, 0, c.size, 0, Math.PI * 2);
            cCtx.fillStyle = '#ffd700';
            cCtx.fill();
            cCtx.lineWidth = 2;
            cCtx.strokeStyle = '#b8860b';
            cCtx.stroke();
            cCtx.restore();

            if (c.y > cH + 50) coins.splice(i, 1);
        }
        requestAnimationFrame(coinRainLoop);
    }
    requestAnimationFrame(coinRainLoop);

    /* -------------------------------------------------------------
       4. INITIAL RENDER & CONTROLS
       ------------------------------------------------------------- */
    function initGrid() {
        for (let r = 0; r < 3; r++) {
            populateReelTape(r, [currentGrid[0][r], currentGrid[1][r], currentGrid[2][r]]);
        }
        populateReelTape(3, [MULTIPLIERS[1], currentSpecial, MULTIPLIERS[2]], true);
        syncUI();
    }

    function populateReelTape(reelIdx, syms, isSpecial = false) {
        const tape = document.getElementById(`tape${reelIdx}`);
        tape.innerHTML = '';
        syms.forEach((sym, row) => {
            const cell = document.createElement('div');
            cell.className = 'symbol-cell';
            cell.id = `cell_${row}_${reelIdx}`;
            const src = isSpecial ? sym.src : SYMBOLS[sym].src;
            const alt = isSpecial ? sym.id : sym;
            cell.innerHTML = `<img src="${src}" alt="${alt}">`;
            tape.appendChild(cell);
        });
    }

    function syncUI() {
        const cost = isExtraBet ? Math.round(baseBet * 1.5) : baseBet;
        document.getElementById('userBalance').innerText = '$' + balance.toLocaleString();
        document.getElementById('betAmount').innerText = '$' + cost.toLocaleString();
        document.getElementById('baseBetDisplay').innerText = '$' + baseBet;
    }

    function adjustBet(delta) {
        if (isSpinning) return;
        const bets = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000];
        let idx = bets.indexOf(baseBet);
        if (idx === -1) idx = 2;
        idx = Math.max(0, Math.min(bets.length - 1, idx + delta));
        baseBet = bets[idx];
        syncUI();
    }

    function toggleExtraBet() {
        if (isSpinning) return;
        isExtraBet = !isExtraBet;
        document.getElementById('extraBetToggle').classList.toggle('active', isExtraBet);
        syncUI();
    }

    function toggleTurbo() {
        isTurbo = !isTurbo;
        document.getElementById('turboToggle').classList.toggle('active', isTurbo);
    }

    function toggleAutoSpin() {
        const btn = document.getElementById('autoSpinToggle');
        if (isAuto) {
            isAuto = false;
            autoCount = 0;
            btn.classList.remove('active');
            btn.innerText = 'AUTO';
        } else {
            isAuto = true;
            autoCount = 20;
            btn.classList.add('active');
            btn.innerText = `AUTO (${autoCount})`;
            if (!isSpinning) executeSpin();
        }
    }

    /* -------------------------------------------------------------
       5. REAL REEL SPINNING PHYSICS (Rolling Strip Animation)
       ------------------------------------------------------------- */
    function getRandomMainSym() {
        return MAIN_KEYS[Math.floor(Math.random() * MAIN_KEYS.length)];
    }

    function getRandomSpecial() {
        const pool = isExtraBet ? MULTIPLIERS.filter(m => m.id !== '1X') : MULTIPLIERS;
        return pool[Math.floor(Math.random() * pool.length)];
    }

    async function executeSpin() {
        if (isSpinning) return;
        audio.init();

        const cost = isExtraBet ? Math.round(baseBet * 1.5) : baseBet;
        if (balance < cost) {
            alert('Insufficient balance!');
            isAuto = false;
            document.getElementById('autoSpinToggle').classList.remove('active');
            return;
        }

        isSpinning = true;
        balance -= cost;
        syncUI();
        document.getElementById('lastWinAmount').innerText = '$0';
        document.getElementById('spinButton').classList.add('spinning');
        clearWinHighlights();

        audio.playSpinStart();

        // 1. Generate target outcomes
        const nextGrid = [
            [getRandomMainSym(), getRandomMainSym(), getRandomMainSym()],
            [getRandomMainSym(), getRandomMainSym(), getRandomMainSym()],
            [getRandomMainSym(), getRandomMainSym(), getRandomMainSym()]
        ];
        const nextSpecial = getRandomSpecial();

        // 2. Animate rolling tapes with physics
        const promises = [
            spinTapeWithPhysics(0, [nextGrid[0][0], nextGrid[1][0], nextGrid[2][0]], false, isTurbo ? 350 : 700),
            spinTapeWithPhysics(1, [nextGrid[0][1], nextGrid[1][1], nextGrid[2][1]], false, isTurbo ? 450 : 900),
            spinTapeWithPhysics(2, [nextGrid[0][2], nextGrid[1][2], nextGrid[2][2]], false, isTurbo ? 550 : 1100),
            spinTapeWithPhysics(3, [MULTIPLIERS[2], nextSpecial, MULTIPLIERS[1]], true, isTurbo ? 650 : 1300)
        ];

        await Promise.all(promises);

        currentGrid = nextGrid;
        currentSpecial = nextSpecial;
        document.getElementById('spinButton').classList.remove('spinning');

        // 3. Evaluate results
        await evaluatePayout();

        isSpinning = false;

        // Auto spin loop
        if (isAuto && autoCount > 0) {
            autoCount--;
            document.getElementById('autoSpinToggle').innerText = `AUTO (${autoCount})`;
            if (autoCount <= 0) {
                isAuto = false;
                document.getElementById('autoSpinToggle').classList.remove('active');
                document.getElementById('autoSpinToggle').innerText = 'AUTO';
            } else {
                setTimeout(() => { if (isAuto) executeSpin(); }, isTurbo ? 250 : 600);
            }
        }
    }

    function spinTapeWithPhysics(reelIdx, finalSyms, isSpecial, duration) {
        return new Promise(resolve => {
            const tape = document.getElementById(`tape${reelIdx}`);
            const dummyCount = isTurbo ? 6 : 14;
            const tapeList = [];

            // Add dummy scrolling symbols
            for (let i = 0; i < dummyCount; i++) {
                tapeList.push(isSpecial ? getRandomSpecial() : getRandomMainSym());
            }
            finalSyms.forEach(s => tapeList.push(s));

            tape.innerHTML = '';
            tapeList.forEach((sym, idx) => {
                const cell = document.createElement('div');
                cell.className = 'symbol-cell';
                if (idx >= tapeList.length - 3) {
                    cell.id = `cell_${idx - (tapeList.length - 3)}_${reelIdx}`;
                }
                const src = isSpecial ? sym.src : SYMBOLS[sym].src;
                const alt = isSpecial ? sym.id : sym;
                cell.innerHTML = `<img src="${src}" alt="${alt}">`;
                tape.appendChild(cell);
            });

            const cellH = window.innerWidth <= 768 ? 75 : 110;
            const targetY = -(dummyCount * cellH);

            tape.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.85, 0.25, 1.04)`;
            tape.style.transform = `translateY(${targetY}px)`;

            setTimeout(() => {
                audio.playReelStop(reelIdx);
                tape.style.transition = 'none';
                tape.style.transform = 'translateY(0px)';
                populateReelTape(reelIdx, finalSyms, isSpecial);
                resolve();
            }, duration);
        });
    }

    /* -------------------------------------------------------------
       6. PAYLINE EVALUATION & BONUS TRIGGERS
       ------------------------------------------------------------- */
    async function evaluatePayout() {
        let totalWin = 0;
        const hits = [];

        PAYLINES.forEach(line => {
            const s0 = currentGrid[line.coords[0][0]][line.coords[0][1]];
            const s1 = currentGrid[line.coords[1][0]][line.coords[1][1]];
            const s2 = currentGrid[line.coords[2][0]][line.coords[2][1]];

            const match = checkLine(s0, s1, s2);
            if (match) {
                hits.push({ line, symbol: match, payout: SYMBOLS[match].payout * baseBet });
            }
        });

        // Lucky wheel bonus triggered on center position of reel 4
        if (currentSpecial.isWheel) {
            audio.playWheelBonusTrigger();
            await triggerLuckyWheel();
            return;
        }

        const mult = currentSpecial.mult || 1;

        if (hits.length > 0) {
            hits.forEach(h => {
                totalWin += h.payout * mult;
                h.line.coords.forEach(([r, c]) => {
                    const el = document.getElementById(`cell_${r}_${c}`);
                    if (el) el.classList.add('win-hit');
                });
            });

            balance += totalWin;
            document.getElementById('lastWinAmount').innerText = '$' + totalWin.toLocaleString();
            syncUI();

            if (totalWin >= baseBet * 20) {
                audio.playBigWinFanfare();
                emitCoins(75);
                showBigWinModal(totalWin);
            } else {
                audio.playWinLine(hits.length);
            }
        }
    }

    function checkLine(s0, s1, s2) {
        const naturals = [s0, s1, s2].filter(s => s !== 'WILD');
        if (naturals.length === 0) return 'WILD';
        const target = naturals[0];
        const ok = [s0, s1, s2].every(s => s === 'WILD' || s === target);
        return ok ? target : null;
    }

    function clearWinHighlights() {
        document.querySelectorAll('.symbol-cell').forEach(c => c.classList.remove('win-hit'));
    }

    function triggerLuckyWheel() {
        return new Promise(resolve => {
            const modal = document.getElementById('wheelModal');
            modal.classList.add('show');
            window._wheelResolve = resolve;
        });
    }

    function spinBonusWheel() {
        const btn = document.getElementById('wheelSpinBtn');
        const disc = document.getElementById('wheelDisc');
        btn.disabled = true;

        const prizes = [20, 25, 30, 50, 100, 200, 500, 1000];
        const chosen = prizes[Math.floor(Math.random() * prizes.length)];
        const rot = 1440 + Math.floor(Math.random() * 360);

        disc.style.transition = 'transform 3.5s cubic-bezier(0.15, 0.9, 0.25, 1)';
        disc.style.transform = `rotate(${rot}deg)`;

        setTimeout(() => {
            const win = chosen * baseBet;
            balance += win;
            document.getElementById('lastWinAmount').innerText = '$' + win.toLocaleString();
            syncUI();
            document.getElementById('wheelModal').classList.remove('show');
            btn.disabled = false;
            disc.style.transition = 'none';
            disc.style.transform = 'rotate(0deg)';
            emitCoins(100);
            showBigWinModal(win);
            if (window._wheelResolve) window._wheelResolve();
        }, 4000);
    }

    function showBigWinModal(amount) {
        const m = document.getElementById('bigWinModal');
        document.getElementById('bigWinAmount').innerText = '$' + amount.toLocaleString();
        m.classList.add('show');
        setTimeout(() => { m.classList.remove('show'); }, 3000);
    }

    window.addEventListener('DOMContentLoaded', initGrid);
</script>
