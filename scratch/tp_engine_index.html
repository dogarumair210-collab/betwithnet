<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Teen Patti Versus | King Midas Games</title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit" />
  <meta name="force-rendering" content="webkit" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />
  <meta name="x5-page-mode" content="app">
  <link rel="stylesheet" type="text/css" href="style-mobile.css" />
  <style>
    /* Ensure clean rendering and hide any demo popups */
    html, body {
      background: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #GameCanvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

  <script src="src/settings.js?v=20260927_01" charset="utf-8"></script>
  <script src="main.js?v=20260927_01" charset="utf-8"></script>
  <script type="text/javascript">
    (function () {
      var splash = document.getElementById('splash');
      if (splash) splash.style.display = 'block';
      window.startLoadingTime = new Date();

      function loadScript(moduleName, cb) {
        function scriptLoaded() {
          if (domScript.parentNode) {
            domScript.parentNode.removeChild(domScript);
          }
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
        }
        var domScript = document.createElement('script');
        domScript.async = true;
        domScript.src = moduleName;
        domScript.addEventListener('load', scriptLoaded, false);
        document.body.appendChild(domScript);
      }

      loadScript('cocos2d-js-min.js', function () {
        if (typeof window.boot === 'function') {
          window.boot();
        }
      });
    })();
  </script>
</body>
</html>
