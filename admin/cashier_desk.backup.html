<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070d14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cashier Desk Mobile - Bet With Net Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #070d14;
            --bg-card: #0e1724;
            --bg-card-sub: #132032;
            --border-line: #1c2c42;
            --accent-gold: #f5a623;
            --accent-green: #00e700;
            --accent-cyan: #00d2ff;
            --accent-red: #ff3b30;
            --text-main: #f8fafc;
            --text-muted: #8e9bb0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* App Shell */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top App Bar */
        .app-header {
            height: 56px;
            background: rgba(14, 23, 36, 0.98);
            border-bottom: 1px solid var(--border-line);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f5a623, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 10px rgba(245, 166, 35, 0.35);
        }

        .brand-titles {
            display: flex;
            flex-direction: column;
        }
        .brand-main {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #fff;
            line-height: 1.1;
        }
        .brand-sub {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulseDot 1.5s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-hdr-action {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-line);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-hdr-action:active { transform: scale(0.92); }

        /* Stats Ribbon */
        .stats-ribbon {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(11, 19, 30, 0.9);
            border-bottom: 1px solid var(--border-line);
            flex-shrink: 0;
        }

        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-meta {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .stat-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 900;
            color: #fff;
        }
        .stat-badge {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* Segmented Tabs */
        .tabs-container {
            display: flex;
            padding: 8px 14px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border-line);
            gap: 8px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-line);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(245, 166, 35, 0.2), rgba(217, 119, 6, 0.2));
            border-color: var(--accent-gold);
            color: #fff;
            box-shadow: 0 0 15px rgba(245, 166, 35, 0.25);
        }
        .tab-btn.tab-withdraw.active {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(0, 150, 255, 0.2));
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.25);
        }

        .tab-badge {
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .tab-btn.active .tab-badge {
            background: var(--accent-gold);
            color: #000;
        }
        .tab-btn.tab-withdraw.active .tab-badge {
            background: var(--accent-cyan);
            color: #000;
        }

        /* Scrollable List Body */
        .list-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 14px 80px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Transaction Card */
        .tx-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .tx-card:active {
            transform: scale(0.99);
        }

        .tx-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-card-sub);
            border: 1.5px solid var(--border-line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #fff;
            flex-shrink: 0;
        }

        .user-names {
            display: flex;
            flex-direction: column;
        }
        .user-fullname {
            font-size: 13.5px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }
        .user-submeta {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .method-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-easypaisa { background: rgba(0, 231, 0, 0.15); color: #00e700; border: 1px solid rgba(0, 231, 0, 0.35); }
        .badge-jazzcash { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.35); }
        .badge-bank { background: rgba(0, 210, 255, 0.15); color: #00d2ff; border: 1px solid rgba(0, 210, 255, 0.35); }
        .badge-crypto { background: rgba(245, 166, 35, 0.15); color: #f5a623; border: 1px solid rgba(245, 166, 35, 0.35); }

        /* Amount & Details Block */
        .tx-details-box {
            background: var(--bg-card-sub);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .amount-display {
            display: flex;
            flex-direction: column;
        }
        .amount-pkr {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-green);
        }
        .amount-usd {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .tid-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .tid-label {
            font-size: 9.5px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .tid-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            font-weight: 800;
            color: var(--accent-gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Sender / Recipient info */
        .account-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            color: #cbd5e1;
            padding: 0 4px;
        }
        .account-num-bold {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
        }

        /* Action Buttons */
        .tx-actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-action {
            height: 42px;
            border-radius: 12px;
            border: none;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-action:active { transform: scale(0.95); }

        .btn-approve {
            background: linear-gradient(135deg, #00e700, #00a800);
            color: #000;
            box-shadow: 0 4px 12px rgba(0, 231, 0, 0.3);
        }
        .btn-reject {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.35);
            color: #ff3b30;
        }
        .btn-view-proof {
            grid-column: span 2;
            height: 36px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: var(--accent-cyan);
            font-size: 12px;
            border-radius: 10px;
        }

        /* Empty state */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }
        .empty-icon {
            font-size: 48px;
            opacity: 0.8;
        }
        .empty-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }
        .empty-desc {
            font-size: 12px;
            max-width: 260px;
            line-height: 1.4;
        }

        /* Image Proof Modal */
        #proofModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        #proofModal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .proof-modal-hdr {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-line);
        }
        .proof-modal-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            overflow: auto;
        }
        .proof-modal-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* Toast notification */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(14, 23, 36, 0.95);
            border: 1px solid var(--accent-gold);
            color: #fff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 6px 25px rgba(0,0,0,0.8);
            z-index: 9999;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-msg.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-icon-box">👑</div>
                <div class="brand-titles">
                    <span class="brand-main">BWN CASHIER</span>
                    <span class="brand-sub">
                        <span class="live-dot"></span>
                        REAL-TIME DESK
                    </span>
                </div>
            </div>

            <div class="header-actions">
                <button id="btnSound" class="btn-hdr-action" title="Audio Alert Toggle">🔔</button>
                <button id="btnRefresh" class="btn-hdr-action" title="Manual Refresh">🔄</button>
            </div>
        </header>

        <!-- 30-Second Alarm Banner -->
        <div id="alarmBanner" style="display:none; background:linear-gradient(135deg, #ff3b30, #b91c1c); color:#fff; padding:10px 16px; font-weight:800; font-size:12px; align-items:center; justify-content:space-between; box-shadow:0 4px 15px rgba(255,59,48,0.5); z-index:100; flex-shrink:0;">
            <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:18px;">🚨</span>
                <span id="alarmBannerText">NEW CASHIER REQUEST! Bell ringing for 30s...</span>
            </div>
            <button onclick="stop30SecondBellAlarm()" style="background:#fff; color:#b91c1c; border:none; border-radius:8px; padding:5px 12px; font-size:11px; font-weight:900; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.3);">🔕 STOP</button>
        </div>

        <!-- Stats Ribbon -->
        <div class="stats-ribbon">
            <div class="stat-pill">
                <div class="stat-meta">
                    <span class="stat-label">Pending Deposits</span>
                    <span id="statDepPending" class="stat-val" style="color:var(--accent-gold);">0</span>
                </div>
                <div class="stat-badge" style="background:rgba(245,166,35,0.15); color:var(--accent-gold);">💳</div>
            </div>
            <div class="stat-pill">
                <div class="stat-meta">
                    <span class="stat-label">Pending Payouts</span>
                    <span id="statWithPending" class="stat-val" style="color:var(--accent-cyan);">0</span>
                </div>
                <div class="stat-badge" style="background:rgba(0,210,255,0.15); color:var(--accent-cyan);">💸</div>
            </div>
        </div>

        <!-- Segmented Tab Bar -->
        <div class="tabs-container">
            <button id="tabBtnDeposits" class="tab-btn active" onclick="switchTab('deposits')">
                <span>💳 DEPOSITS</span>
                <span id="badgeDepCount" class="tab-badge">0</span>
            </button>
            <button id="tabBtnWithdrawals" class="tab-btn tab-withdraw" onclick="switchTab('withdrawals')">
                <span>💸 WITHDRAWALS</span>
                <span id="badgeWithCount" class="tab-badge">0</span>
            </button>
        </div>

        <!-- Transaction Cards Feed -->
        <main id="txFeed" class="list-container">
            <!-- Rendered dynamically -->
        </main>

    </div>

    <!-- Receipt / Screenshot Proof Modal -->
    <div id="proofModal">
        <div class="proof-modal-hdr">
            <span style="font-weight:800; font-size:14px; color:#fff;">📸 Transaction Receipt Proof</span>
            <button class="btn-hdr-action" onclick="closeProofModal()">✕</button>
        </div>
        <div class="proof-modal-body">
            <img id="modalProofImg" class="proof-modal-img" src="" alt="Proof">
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastBox" class="toast-msg">Success</div>

    <script>
    (function () {
        'use strict';

        let currentTab = 'deposits';
        let soundEnabled = true;
        let lastPendingCount = -1; // -1 to detect initial load
        let pollingTimer = null;

        // Audio synthesizer for incoming deposit/withdraw alert
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }
        // Unlock AudioContext on first touch/click
        document.addEventListener('click', () => { getAudioContext(); }, { once: true });
        document.addEventListener('touchstart', () => { getAudioContext(); }, { once: true });

        function playDing() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            try {
                const now = ctx.currentTime;
                // Double loud chime (Ding-Dong 880Hz -> 1320Hz)
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.frequency.setValueAtTime(880, now);
                gain1.gain.setValueAtTime(0.5, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.35);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.frequency.setValueAtTime(1320, now + 0.18);
                gain2.gain.setValueAtTime(0.55, now + 0.18);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.18);
                osc2.stop(now + 0.65);

                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch (e) {}
        }

        let alarmInterval = null;
        let alarmTimeout = null;

        function start30SecondBellAlarm(count) {
            if (!soundEnabled) return;
            stop30SecondBellAlarm();

            const banner = document.getElementById('alarmBanner');
            const bannerTxt = document.getElementById('alarmBannerText');
            if (banner) {
                banner.style.display = 'flex';
                if (bannerTxt) bannerTxt.textContent = `🚨 ${count} NEW CASHIER REQUEST(S)! Ringing for 30s...`;
            }

            playDing();
            alarmInterval = setInterval(() => {
                playDing();
            }, 1200);

            alarmTimeout = setTimeout(() => {
                stop30SecondBellAlarm();
            }, 30000);
        }

        window.stop30SecondBellAlarm = function () {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            if (alarmTimeout) {
                clearTimeout(alarmTimeout);
                alarmTimeout = null;
            }
            const banner = document.getElementById('alarmBanner');
            if (banner) banner.style.display = 'none';
        };

        // Cache for transactions
        let depositsData = [];
        let withdrawalsData = [];

        async function fetchNotifications() {
            try {
                const res = await fetch('../api/admin.php?action=pending_notifications&admin_pin=7777', {
                    headers: { 'X-Admin-Pin': '7777' },
                    cache: 'no-store'
                });
                const json = await res.json();

                if (json && (json.success === true || json.status === 'success') && json.data) {
                    const data = json.data;
                    document.getElementById('statDepPending').textContent = data.pending_deposits_count || 0;
                    document.getElementById('statWithPending').textContent = data.pending_withdrawals_count || 0;
                    document.getElementById('badgeDepCount').textContent = data.pending_deposits_count || 0;
                    document.getElementById('badgeWithCount').textContent = data.pending_withdrawals_count || 0;

                    const total = (data.pending_deposits_count || 0) + (data.pending_withdrawals_count || 0);
                    if (lastPendingCount === -1) {
                        lastPendingCount = total;
                        if (total > 0) {
                            start30SecondBellAlarm(total);
                            showToast(`🚨 ${total} Pending Request(s) Waiting for Cashier!`);
                        }
                    } else if (total > lastPendingCount) {
                        const diff = total - lastPendingCount;
                        start30SecondBellAlarm(diff);
                        showToast(`🚨 ${diff} New Request(s) Received! (Bell Ringing 30s)`);
                        lastPendingCount = total;
                    } else {
                        lastPendingCount = total;
                    }

                    // Separate into deposits & withdrawals
                    const items = data.items || [];
                    depositsData = items.filter(t => t.type === 'deposit');
                    withdrawalsData = items.filter(t => t.type === 'withdraw' || t.type === 'withdrawal');

                    renderList();
                } else {
                    fetchTransactionsList();
                }
            } catch (err) {
                fetchTransactionsList();
            }
        }

        async function fetchTransactionsList() {
            try {
                const depRes = await fetch('../api/admin.php?action=transactions&type=deposit&status=Pending&limit=50&admin_pin=7777', {
                    headers: { 'X-Admin-Pin': '7777' }
                });
                const depJson = await depRes.json();
                if (depJson && (depJson.success === true || depJson.status === 'success') && depJson.data && depJson.data.transactions) {
                    depositsData = depJson.data.transactions;
                    document.getElementById('statDepPending').textContent = depositsData.length;
                    document.getElementById('badgeDepCount').textContent = depositsData.length;
                }

                const withRes = await fetch('../api/admin.php?action=transactions&type=withdraw&status=Pending&limit=50&admin_pin=7777', {
                    headers: { 'X-Admin-Pin': '7777' }
                });
                const withJson = await withRes.json();
                if (withJson && (withJson.success === true || withJson.status === 'success') && withJson.data && withJson.data.transactions) {
                    withdrawalsData = withJson.data.transactions;
                    document.getElementById('statWithPending').textContent = withdrawalsData.length;
                    document.getElementById('badgeWithCount').textContent = withdrawalsData.length;
                }

                renderList();
            } catch (e) {
                renderList();
            }
        }

        function renderList() {
            const feed = document.getElementById('txFeed');
            feed.innerHTML = '';

            const list = (currentTab === 'deposits') ? depositsData : withdrawalsData;

            if (!list || list.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">${currentTab === 'deposits' ? '💳' : '💸'}</div>
                        <div class="empty-title">All Caught Up!</div>
                        <div class="empty-desc">No pending ${currentTab} at this moment. You will hear an audible alert when a real user submits a request.</div>
                    </div>
                `;
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'tx-card';

                const pkr = Number(item.amount_pkr || (item.amount_usd ? item.amount_usd * 278 : 0));
                const usd = Number(item.amount_usd || (pkr / 278)).toFixed(2);
                const methodLower = (item.method || '').toLowerCase();

                let badgeClass = 'badge-easypaisa';
                if (methodLower.includes('jazz')) badgeClass = 'badge-jazzcash';
                else if (methodLower.includes('bank') || methodLower.includes('raast')) badgeClass = 'badge-bank';
                else if (methodLower.includes('usdt') || methodLower.includes('crypto')) badgeClass = 'badge-crypto';

                const senderNum = item.sender_account || item.account_number || item.phone || '-';
                const trxId = item.trx_id || item.trxId || '-';
                const userName = item.full_name || item.username || `User #${item.user_id}`;
                const hasProof = (item.proof_image || item.proofImage || item.proof);
                const notes = item.notes || '';

                card.innerHTML = `
                    <div class="tx-card-header">
                        <div class="user-info">
                            <div class="user-avatar-circle">👤</div>
                            <div class="user-names">
                                <span class="user-fullname">${escapeHtml(userName)}</span>
                                <span class="user-submeta">ID: ${escapeHtml(item.user_id || item.id)}</span>
                            </div>
                        </div>
                        <span class="method-badge ${badgeClass}">${escapeHtml(item.method || 'Cashier')}</span>
                    </div>

                    <div class="tx-details-box">
                        <div class="amount-display">
                            <span class="amount-pkr">₨ ${pkr.toLocaleString()}</span>
                            <span class="amount-usd">$ ${usd} USD</span>
                        </div>
                        <div class="tid-box">
                            <span class="tid-label">TRX / TID</span>
                            <span class="tid-val" onclick="copyText('${escapeHtml(trxId)}')">
                                ${escapeHtml(trxId)} 📋
                            </span>
                        </div>
                    </div>

                    <div class="account-info-row">
                        <span>Account / Phone:</span>
                        <span class="account-num-bold" onclick="copyText('${escapeHtml(senderNum)}')">${escapeHtml(senderNum)} 📋</span>
                    </div>

                    ${notes ? `
                        <div style="font-size:11px; color:#f59e0b; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.25); border-radius:8px; padding:6px 10px; margin-top:6px;">
                            ${escapeHtml(notes)}
                        </div>
                    ` : ''}

                    <div class="tx-actions-row">
                        ${hasProof ? `
                            <button class="btn-action btn-view-proof" onclick="viewProof('${escapeHtml(hasProof)}')">
                                📸 View Receipt Screenshot
                            </button>
                        ` : ''}
                        <button class="btn-action btn-approve" onclick="handleAction('${item.id}', 'Approved')">
                            ✓ Approve
                        </button>
                        <button class="btn-action btn-reject" onclick="handleAction('${item.id}', 'Rejected')">
                            ✕ Reject
                        </button>
                    </div>
                `;

                feed.appendChild(card);
            });
        }

        window.switchTab = function (tab) {
            currentTab = tab;
            document.getElementById('tabBtnDeposits').classList.toggle('active', tab === 'deposits');
            document.getElementById('tabBtnWithdrawals').classList.toggle('active', tab === 'withdrawals');
            renderList();
        };

        window.handleAction = async function (txId, newStatus) {
            const confirmMsg = (newStatus === 'Approved')
                ? `Confirm APPROVE transaction #${txId}?`
                : `Confirm REJECT transaction #${txId}?`;

            if (!confirm(confirmMsg)) return;

            try {
                showToast(`Processing #${txId}...`);
                const res = await fetch('../api/admin.php?action=update_transaction&admin_pin=7777', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': '7777' },
                    body: JSON.stringify({ id: txId, status: newStatus, admin_pin: '7777' })
                });
                const json = await res.json();

                if (json && (json.success === true || json.status === 'success')) {
                    showToast(`✓ Transaction #${txId} marked ${newStatus}!`);
                    fetchNotifications();
                } else {
                    alert(json.message || 'Action failed.');
                }
            } catch (err) {
                alert('Network error while processing.');
            }
        };

        window.viewProof = function (imgUrl) {
            const modal = document.getElementById('proofModal');
            const img = document.getElementById('modalProofImg');
            img.src = imgUrl;
            modal.classList.add('active');
        };

        window.closeProofModal = function () {
            document.getElementById('proofModal').classList.remove('active');
        };

        window.copyText = function (txt) {
            if (!txt || txt === '-') return;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(txt).then(() => showToast(`Copied: ${txt}`));
            } else {
                showToast(`Copied: ${txt}`);
            }
        };

        function showToast(msg) {
            const box = document.getElementById('toastBox');
            box.textContent = msg;
            box.classList.add('show');
            setTimeout(() => box.classList.remove('show'), 2200);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Event listeners
        document.getElementById('btnRefresh').addEventListener('click', () => {
            showToast('Refreshing ledger...');
            fetchNotifications();
        });

        document.getElementById('btnSound').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('btnSound').textContent = soundEnabled ? '🔔' : '🔕';
            showToast(soundEnabled ? 'Alert chime ON' : 'Alert chime OFF');
        });

        // Initialize polling loop every 5 seconds
        fetchNotifications();
        pollingTimer = setInterval(fetchNotifications, 5000);

    })();
    </script>
</body>
</html>
