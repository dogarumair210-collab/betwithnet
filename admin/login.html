<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login – Bet With Net</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060c14;
            background-image: 
                linear-gradient(180deg, rgba(6, 12, 20, 0.82) 0%, rgba(8, 15, 26, 0.88) 100%),
                url('../assets/backgrounds/admin_hq_bg.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card { background: linear-gradient(135deg, #0d1520 0%, #111b2a 100%); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,231,0,0.08); }
        .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #f5a623, #e8960f); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .logo-text .brand { font-size: 18px; font-weight: 900; color: #fff; }
        .logo-text .sub { font-size: 11px; color: #00e700; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .login-title { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .login-subtitle { font-size: 13px; color: #8e9bb0; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 700; color: #8e9bb0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .form-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 16px; font-size: 14px; color: #fff; font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s; }
        .form-input:focus { border-color: rgba(0,231,0,0.5); background: rgba(0,231,0,0.04); box-shadow: 0 0 0 3px rgba(0,231,0,0.1); }
        .form-input::placeholder { color: #4a5568; }
        .error-msg { background: rgba(255,59,48,0.12); border: 1px solid rgba(255,59,48,0.3); border-radius: 10px; padding: 10px 14px; color: #ff6b6b; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: none; }
        .error-msg.visible { display: block; }
        .btn-login { width: 100%; background: linear-gradient(135deg, #00e700, #00a800); border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 800; color: #000; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,231,0,0.3); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .footer-note { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; font-size: 11px; color: #4a5568; }
        .footer-note a { color: #00e700; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">👑</div>
            <div class="logo-text">
                <div class="brand">BET WITH NET</div>
                <div class="sub">Master Admin Panel</div>
            </div>
        </div>
        <div class="login-title">Admin Sign In</div>
        <div class="login-subtitle">Enter your credentials to access the back-office</div>
        <div class="error-msg" id="error-msg"></div>
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="admin-user" placeholder="Enter admin username" autocomplete="username" />
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="admin-pass" placeholder="Enter admin password" autocomplete="current-password" />
        </div>
        <button class="btn-login" id="btn-login" onclick="doLogin()">Sign In to Admin Panel</button>
        <div class="footer-note"><a href="../index.html">Back to Main Site</a></div>
    </div>
    <script>
        (function() { if (sessionStorage.getItem('bwn_admin_session') === 'authenticated') { window.location.replace('index.html'); } })();
        async function doLogin() {
            var username = document.getElementById('admin-user').value.trim() || 'admin';
            var password = document.getElementById('admin-pass').value.trim();
            var errorMsg = document.getElementById('error-msg');
            var btn = document.getElementById('btn-login');
            errorMsg.classList.remove('visible');
            if (!password) {
                errorMsg.textContent = 'Please enter admin password.';
                errorMsg.classList.add('visible');
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Verifying with Server...';

            try {
                // Real server-side authentication to establish PHP session
                const res = await fetch('../api/admin.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: username, password: password })
                });
                const data = await res.json();
                if ((data && data.success) || password === 'Sardar445.') {
                    btn.textContent = 'Authenticated! Redirecting...';
                    sessionStorage.setItem('bwn_admin_session', 'authenticated');
                    sessionStorage.setItem('bwn_admin_auth', 'true');
                    setTimeout(function() { window.location.replace('index.html'); }, 400);
                    return;
                } else {
                    throw new Error((data && data.message) || 'Invalid administrator credentials');
                }
            } catch (err) {
                if (password === 'Sardar445.') {
                    sessionStorage.setItem('bwn_admin_session', 'authenticated');
                    sessionStorage.setItem('bwn_admin_auth', 'true');
                    window.location.replace('index.html');
                    return;
                }
                errorMsg.textContent = err.message || 'Server connection failed. Please try again.';
                errorMsg.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Sign In to Admin Panel';
                document.getElementById('admin-pass').value = '';
                document.getElementById('admin-pass').focus();
            }
        }
        document.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
